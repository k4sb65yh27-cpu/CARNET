  }else{setTxt('#wclock',hms(e));var rp=wReps(w,w.taps.length);setTxt('#wpace',e>=20&&rp?String(Math.round(rp/e*60)):'—');
    if(isSq(w.k)){var x=wStep(w,w.taps.length);if(x&&x.rest){var lt=w.taps.length?w.taps[w.taps.length-1]:0,rem=x.rest-(e-lt);
      if(rem<=0){w.taps.push(Math.round((lt+x.rest)*10)/10);w.lc=-1;beep(1320,.4,.3);buzz([200,80,200]);save();paint();return}
      var s3=Math.ceil(rem);if(s3<=3&&s3!==w.lc){w.lc=s3;beep(760,.12,.24)}setTxt('#wrest',mmss(rem))}}}
}
function wodTap(rp){var w=S.wod;if(!w||w.st!=='run'||w.pz)return;var now=Date.now();if(rp===undefined&&now-_wt<350)return;_wt=now;
  var x=wStep(w,w.taps.length);if(!x)return;
  if(rp!==undefined&&!x.rest){w.rp=w.rp||{};w.rp[w.taps.length]=Math.max(0,rp)}

  if(isSq(w.k)?x.end:w.taps.length%x.per===0){beep(1320,.12,.3);setTimeout(function(){beep(1760,.16,.3)},120);hap('big')}else{beep(1040,.07,.22);hap('ok')}

function wodEnd(auto){var w=S.wod;if(!w)return;var now=Date.now();

function wodSave(){var w=S.wod;if(!w)return;var g=function(i){var e=$('#'+i);return e?e.value:''};

  else if(isSq(w.k)){wd.cfg=w.cfg;wd.done=n>=wSteps(w)?1:0;wd.full=wd.done&&!wLess(w)?1:0;

  else{wd.top=w.top;wd.done=n>=wSteps(w)?1:0}

  case 'open-s': openSheet(seanceSheet(id)); break;
  case 's-edit': {var sx=seanceById(id);if(!sx)break;
    if(sx.type==='renfo')openSheet(editRenfoSheet(id));
    else{EDS=JSON.parse(JSON.stringify(sx));openSheet(cardioForm(Object.assign({},sx,{edit:id})))}
    break}
  case 'ed-add': {var ex2=exo(id),prv=EDS.sets.filter(function(x){return x.exoId===id}).slice(-1)[0];edCollect();
    EDS.sets.push({id:uid(),exoId:id,reps:prv?prv.reps:((ex2&&ex2.unite==='sec')?30:6),charge:prv?prv.charge:0,rpe:null,pr:false});sheetRefresh(renderEdit()); break}
  case 'ed-w': {edCollect();var ew=null;EDS.sets.forEach(function(x){if(x.id===id)ew=x});if(!ew)break;
    if(ew.w)delete ew.w;else ew.w=1;ew.wx=1;hap('sel');sheetRefresh(renderEdit()); break}
  case 'ed-rm': edCollect();EDS.sets=EDS.sets.filter(function(x){return x.id!==id});sheetRefresh(renderEdit()); break;
  case 'ed-exrm': edCollect();EDS.order=EDS.order.filter(function(x){return x!==id});EDS.sets=EDS.sets.filter(function(x){return x.exoId!==id});sheetRefresh(renderEdit()); break;
  case 'ed-exadd': edCollect();openSheet(exoPicker(false,1)); break;
  case 'ed-pick': if(EDS.order.indexOf(id)<0)EDS.order.push(id);
    EDS.sets.push({id:uid(),exoId:id,reps:6,charge:0,rpe:null,pr:false});openSheet(renderEdit()); break;
  case 'ed-save': {edCollect();
    if(!EDS.sets.length){toast('Aucune série');break}
    EDS.order=EDS.order.filter(function(o){return EDS.sets.some(function(x){return x.exoId===o})});
    recalcPR(EDS);
    for(var q=0;q<S.seances.length;q++)if(S.seances[q].id===EDS.id)S.seances[q]=EDS;
    EDS=null;save();closeSheet();toast('Séance modifiée');paint(); break}
  case 's-del': ask({t:'Supprimer cette séance ?',m:'Cette action est définitive.',ok:'Supprimer',danger:1}).then(function(ok){if(!ok)return;
    S.seances=S.seances.filter(function(x){return x.id!==id});save();closeSheet();toast('Séance supprimée');paint()}); break;
  /* exercices */
  case 'exo-new': openSheet(exoSheet(null)); break;
  case 'exo-edit': openSheet(exoSheet(id)); break;
  case 'exu': EXF.unite=b.dataset.v;b.parentNode.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});hap('tap'); break;
  case 'exic': EXF.ic=b.dataset.v;b.parentNode.querySelectorAll('button').forEach(function(x){x.setAttribute('aria-pressed',x===b)});$('#exprev').innerHTML=it(EXF.ic,'c-mus','lg');hap('tap'); break;
  case 'exo-save': {var nom=$('#en').value.trim();if(!nom){toast('Nom requis');break}
    var o={nom:nom,groupe:$('#eg').value.trim()||'Divers',unite:EXF.unite,rest:parseInt($('#er').value)||0,inc:parseFloat($('#ei').value)||0,ic:EXF.ic||'',
      rmin:parseInt($('#erl').value)||0,rmax:parseInt($('#erh').value)||0,cmax:parseFloat(String($('#ecm').value).replace(',','.'))||0,uni:EXF.uni?1:0,note:$('#eno').value.trim()};
    if(!o.rmin&&o.rmax)o.rmin=Math.max(1,o.rmax-2);
    if(o.rmin&&o.rmax&&o.rmax<o.rmin){var sw2=o.rmin;o.rmin=o.rmax;o.rmax=sw2}
    if(id){var ex=exo(id);ex.nom=o.nom;ex.groupe=o.groupe;ex.unite=o.unite;ex.rest=o.rest;ex.inc=o.inc;ex.ic=o.ic;ex.rmin=o.rmin;ex.rmax=o.rmax;ex.cmax=o.cmax;ex.uni=o.uni;ex.note=o.note}
    else{o.id=uid();S.exos.push(o)}
    save();closeSheet();toast(id?'Exercice modifié':'Exercice ajouté');paint(); break}
  case 'exo-del': {var used=S.seances.some(function(s){return (s.sets||[]).some(function(x){return x.exoId===id})});
    ask({t:'Supprimer l\'exercice ?',m:used?'Il apparaît dans ton historique : ces séries perdront leur nom.':'Il sera retiré du catalogue.',ok:'Supprimer',danger:1}).then(function(ok){if(!ok)return;
      S.exos=S.exos.filter(function(x){return x.id!==id});save();closeSheet();paint()}); break}
  /* réglages */
  case 'rest-reset': ask({t:'Repos par défaut partout ?',m:'Tous les exercices repasseront sur '+S.prefs.rest+' s.',ok:'Appliquer'}).then(function(ok){if(!ok)return;
      S.exos.forEach(function(e){e.rest=0});save();toast('Repos par défaut appliqué');paint()}); break;
  case 'lockx': S.prefs.lock=S.prefs.lock?0:1;b.setAttribute('aria-checked',!!S.prefs.lock);save();hap('tap');if(!S.prefs.lock)msStop();else if(T)msStart(); break;
  case 'theme': S.prefs.theme=b.dataset.v;save();hap('tap');paint(); break;
  case 'export': doExport();toast('Sauvegarde exportée'); break;
  case 'import': doImport(); break;
  case 'onb-export': doExport();toast('Sauvegarde exportée'); break;
  case 'onb-import': doImport(function(){onbClose()}); break;
  case 'onb-os': ONBOS=b.dataset.v;hap('tap');reOnb(); break;
  case 'onb-done': case 'onb-skip': hap('ok');onbClose(); break;
  case 'onb-show': showOnb('install'); break;
  case 'reset': ask({t:'Effacer toutes les données ?',m:'Séances, exercices, modèles et repères. Exporte d\'abord si tu veux les garder.',ok:'Continuer',danger:1}).then(function(ok){if(!ok)return;
      return ask({t:'Confirmation',m:'Action irréversible.',ok:'Tout effacer',danger:1})}).then(function(ok){if(!ok)return;
      localStorage.removeItem(KEY);S=fresh();save();toast('Données effacées');go('bilan')}); break;
  }
});
function restoreBloc(){if(window._bd){$('#bn').value=_bd.n;$('#bw').value=_bd.w;$('#bd').value=_bd.d;$('#bs').value=_bd.s;$('#br').value=_bd.r}}
var _pt=null,_prefT=null;
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.id==='exq'){EXQ=t.value;listFilter('#app',t.value);return}
  var st=t.closest('[data-act="stf"]');
  if(st){var i=+st.dataset.i,f=st.dataset.f;
    CFG.stations[i][f]=(f==='s'||f==='dm')?(parseInt(st.value)||0):st.value;
    if(f==='s'&&!CFG.stations[i].s)CFG.stations[i].s=30;
    if(f==='dm'){clearTimeout(_pt);_pt=setTimeout(function(){var c=$('#stcalc');var s=CFG.stations[i];
      if(c||(+s.dm>0)!==!!c)sheetRefresh(stSheet(i));},500)}
    if(f==='i'){var c2=$('#stcalc');if(c2)c2.textContent=mmss(stSec(CFG.stations[i]))}
    return}
  if(t.id&&t.id.indexOf('th_')===0){var key=t.id.slice(3),lim={cmin:[1,60],cgoal:[0,99],ltop:[2,10],hset:[1,8],hpu:[1,40],hlr:[1,40],hpp:[1,80],hrest:[0,10],hsq:[0,300],wset:[1,10],wsw:[1,60],wpp:[1,60],wkg:[0,48],wrest:[0,300]}[key],v=parseInt(t.value)||0;
    if(lim){v=Math.min(lim[1],Math.max(lim[0],v));if(String(v)!==t.value&&ev.isTrusted===false)t.value=v;S.prefs.th[key]=v;save();clearTimeout(_pt);
      _pt=setTimeout(function(){if(TAB==='th'){var y=window.scrollY;paint();window.scrollTo(0,y)}},450)}return}
  var b=t.closest('[data-act="cpar"]');
  if(b){CFG.par[b.dataset.p]=parseFloat(b.value)||0;clearTimeout(_pt);
    _pt=setTimeout(function(){if(TAB==='cardio'&&CFG.fmt&&!T){var y=window.scrollY;var ae=document.activeElement&&document.activeElement.id;paint();window.scrollTo(0,y);
      if(ae&&ae.indexOf('cp_')===0&&ev.isTrusted){var n=document.getElementById(ae);if(n)n.focus()}}},450);return}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='wless'){wodTap(parseInt(t.value)||0);return}
  if(t.id&&t.id.indexOf('gt_')===0){var gk3=t.id.slice(3),g3=S.goals[gk3];if(g3){var vv=(gk3==='ski500'||gk3==='row500')?parseSplit(t.value):parseFloat(t.value);
      if(vv>0){g3.target=gRound(gk3,vv);save();toast('Objectif modifié');paint()}}return}
  if(t.id==='cm'){var cc=$('#ccat');if(cc&&cc.dataset.auto==='1')cc.value=catDefault(t.value);
    var ek2=refKey(t.value),el2=$('#ceffl');if(el2){el2.style.display=ek2?'':'none';if(ek2){$('#cefft').textContent=EFFL[ek2][0];$('#ceffm').textContent=EFFL[ek2][2]}}}
  if(t.id==='ccat')t.dataset.auto='0';
  if(t.dataset&&t.dataset.pref){var k=t.dataset.pref,v=t.dataset.fmt==='split'?parseSplit(t.value):parseFloat(t.value);
    if(k==='rest'&&!(v>0))v=120;if(k==='z2goal'&&!(v>0))v=180;
    S.prefs[k]=isNaN(v)?0:v;if(GK[k])gRebase(k);save();clearTimeout(_prefT);_prefT=setTimeout(function(){toast('Repères enregistrés');paint()},350)}
  if(t.dataset&&t.dataset.act==='stf'&&t.tagName==='SELECT'){var i=+t.dataset.i;sheetRefresh(stSheet(i))}
});
document.addEventListener('focusin',function(e){
  var f=e.target;if(!f.matches||!f.matches('input:not([type=checkbox]):not([readonly]),select,textarea'))return;
  if(!f.closest('#sheet'))return;
  setTimeout(function(){try{f.scrollIntoView({block:'nearest'})}catch(x){}},300);
});
/* iOS : après fermeture du clavier, les barres fixes peuvent rester décalées (viewport non recalculé).
   Réparation : masquer puis réafficher les éléments fixes et relancer le défilement, une fois le clavier fermé. */
var _hv=null;
function healView(){var a=document.activeElement;if(a&&a.matches&&a.matches('input:not([readonly]),textarea,select'))return;
  var y=window.scrollY,els=[].slice.call(document.querySelectorAll('#nav,#abar,#cta,.top,#toast'));
  els.forEach(function(e){e.style.visibility='hidden';e.style.display='none'});void document.body.offsetHeight;
  els.forEach(function(e){e.style.display='';e.style.visibility=''});
  window.scrollTo(0,y+1);window.scrollTo(0,y)}
document.addEventListener('focusout',function(e){var f=e.target;if(f&&f.matches&&f.matches('input:not([readonly]),textarea,select')){clearTimeout(_hv);_hv=setTimeout(healView,180)}});
if(window.visualViewport)window.visualViewport.addEventListener('resize',function(){clearTimeout(_hv);_hv=setTimeout(healView,220)});
window.addEventListener('pageshow',function(){setTimeout(healView,60)});
/* Clavier numérique intégré : remplace le clavier système sur les champs chiffrés des séances et formulaires */
var KP=null;
function kpLabel(inp){var h=inp.closest('.exo,.prow,.li,.edr');if(!h)return '';
  if(h.classList.contains('edr'))return inp.dataset.f==='charge'?'Charge':'Répétitions';
  var t=h.querySelector('.exo>header .n,.n,.t');var base=t?(t.firstChild&&t.firstChild.nodeType===3?t.firstChild.textContent:t.textContent):'';
  var u=inp.parentNode.querySelector('.u');return base+(u&&h.classList.contains('exo')?' · '+u.textContent:'')}
function openKp(inp){closeKp(1);if(!inp)return;
  var dec=!!inp.dataset.kd||/^c_|^c_|cp_/.test(inp.id)||/^c_/.test(inp.id);
  var u=inp.parentNode.querySelector('.u'),unit=u?u.textContent:'',step=null;
  var sb=inp.closest('.stp');if(sb){var bp=sb.querySelector('[data-act="stp"][data-v]:last-child');if(bp)step=+bp.dataset.v}
  KP={inp:inp,v:String(inp.value===''?'':inp.value).replace('.',','),fresh:true,dec:dec||(step&&step%1!==0)};
  var d=document.createElement('div');d.className='kp';d.id='kp';
  var keys=['1','2','3','4','5','6','7','8','9',KP.dec?',':'','0','⌫'];
  d.innerHTML='<div class="kpp" role="dialog" aria-label="Saisie numérique"><div class="kph"><span class="l">'+esc(kpLabel(inp))+'</span><span class="kpv fresh" id="kpv"></span><span class="u">'+esc(unit)+'</span></div>'+
    (step?'<div class="kpc">'+[-2*step,-step,step,2*step].map(function(q){return '<button data-act="kp-q" data-v="'+q+'">'+(q>0?'+':'−')+nfmt(Math.abs(q))+'</button>'}).join('')+'</div>':'')+
    '<div class="kpg">'+keys.map(function(k){return '<button data-act="kp-k" data-k="'+k+'"'+(k?' aria-label="'+(k==='⌫'?'Effacer':k)+'"':' disabled style="visibility:hidden"')+'>'+k+'</button>'}).join('')+'</div>'+
    '<div class="btns"><button class="b" data-act="kp-x">Annuler</button><button class="b pri" data-act="kp-ok">OK</button></div></div>';
  d.addEventListener('click',function(e){if(e.target===d)closeKp()});
  document.body.appendChild(d);kpPaint();hap('sel')}
function kpPaint(){var e=$('#kpv');if(!e||!KP)return;e.textContent=KP.v===''?'0':KP.v;e.classList.toggle('fresh',KP.fresh)}
function kpKey(k){if(!KP)return;
  if(KP.fresh&&k!=='⌫'){KP.v='';KP.fresh=false}
  if(k==='⌫'){KP.fresh=false;KP.v=KP.v.slice(0,-1)}
  else if(k===','){if(KP.v.indexOf(',')<0)KP.v=(KP.v||'0')+','}
  else if(KP.v.replace(',','').length<6){KP.v=(KP.v==='0'?'':KP.v)+k}
  hap('tap');kpPaint()}
function kpQuick(q){if(!KP)return;var v=parseFloat(KP.v.replace(',','.'))||0;v=Math.max(0,Math.round((v+q)*100)/100);KP.v=String(v).replace('.',',');KP.fresh=false;hap('tap');kpPaint()}
function kpOk(){if(!KP)return;var inp=KP.inp,t=KP.v.replace(',','.');
  if(t!==''&&t!=='.'){var v=parseFloat(t);if(!isNaN(v)){inp.value=v;inp.dispatchEvent(new Event('input',{bubbles:true}));inp.dispatchEvent(new Event('change',{bubbles:true}))}}
  hap('ok');closeKp()}
function closeKp(now){var d=$('#kp');KP=null;if(d)d.remove()}
setInterval(function(){var e=$('#sdur');if(e&&S.cur)e.textContent=hms((Date.now()-S.cur.startedAt)/1000)},1000);

if('serviceWorker' in navigator){
  var _rl=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){ if(_rl)return;_rl=true;location.reload() });
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(r){ setInterval(function(){r.update().catch(function(){})},60*60*1000) }).catch(function(){});
  });
}
if(T)TAB='cardio';
if(S.wod&&S.wod.st!=='end')wakeOn();
if(!TAB)TAB='bilan';
try{var _st=JSON.parse(localStorage.getItem(KEY));if(!_st||_st.schema!==SCHEMA)save()}catch(e){save()}
paint();
onbCheck(); if(ONB)showOnb(ONB);
</script>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="color-scheme" content="dark light">
<title>Carnet</title>
<link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=1.14.0">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="format-detection" content="telephone=no">
<style>
:root{
  --bg:#000; --el1:#1C1C1E; --el2:#2C2C2E; --el3:#3A3A3C;
  --sep:rgba(84,84,88,.6); --sep2:rgba(84,84,88,.34);
  --tx:#FFFFFF; --tx2:rgba(235,235,245,.62); --tx3:rgba(235,235,245,.32);
  --ac:#32D8E8; --ac2:#0C9EB4; --acs:rgba(50,216,232,.15); --act:#00161A;
  --red:#FF453A; --grn:#30D158; --yel:#FFD60A; --org:#FF9F0A;
  --glass:rgba(22,22,24,.74); --glass2:rgba(30,30,32,.9);
  --r:12px; --r2:16px; --r3:22px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace;
  --nb:44px; --tb:50px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --ez:cubic-bezier(.32,.72,0,1);
  --work:#FF6B4A; --rec:#32D8E8; --z2:#30D158; --seuil:#FFD60A; --pr:#FFD60A;
  --c-mus:#3987e5; --c-run:#d95926; --c-erg:#9085e9; --c-hyb:#c98500; --c-z2:#199e70;
  --shadow:0 10px 34px rgba(0,0,0,.45);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F2F2F7; --el1:#FFFFFF; --el2:#F2F2F7; --el3:#E5E5EA;
  --sep:rgba(60,60,67,.29); --sep2:rgba(60,60,67,.14);
  --tx:#000000; --tx2:rgba(60,60,67,.66); --tx3:rgba(60,60,67,.36);
  --ac:#00889B; --ac2:#006376; --acs:rgba(0,136,155,.11); --act:#FFFFFF;
  --red:#FF3B30; --grn:#248A3D;
  --glass:rgba(249,249,251,.8); --glass2:rgba(255,255,255,.94);
  --work:#D6421F; --rec:#0A9CB0; --z2:#248A3D; --seuil:#B08600; --pr:#F5B700;
  --c-mus:#2a78d6; --c-run:#eb6834; --c-erg:#4a3aa7; --c-hyb:#eda100; --c-z2:#1baf7a;
  --shadow:0 10px 34px rgba(0,0,0,.14);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);
  font-family:var(--sans);font-size:17px;line-height:1.3;letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;
  padding-bottom:calc(var(--tb) + var(--sb) + 16px);-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
body.cta-on{padding-bottom:calc(var(--tb) + var(--sb) + 96px)}
body.run{padding-bottom:0;overflow:hidden}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.022em}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}

/* ---------- NAV BAR ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:60;height:calc(var(--nb) + var(--st));
  padding:var(--st) 16px 0;display:flex;align-items:center;justify-content:center;transition:background .25s ease}
.top:after{content:'';position:absolute;left:0;right:0;bottom:0;height:.5px;background:var(--sep);opacity:0;transition:opacity .2s}
body.sc .top{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px)}
body.sc .top:after{opacity:1}
.top h1{font-size:17px;font-weight:620;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .25s var(--ez);
  max-width:56%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.sc .top h1{opacity:1;transform:none}
.top .bk{position:absolute;left:6px;bottom:0;height:var(--nb);display:flex;align-items:center;gap:2px;border:0;background:none;
  color:var(--ac);font-size:17px;padding:0 10px 0 4px}
.top .bk svg{width:13px;height:21px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.top .sub{position:absolute;right:16px;bottom:13px;font-size:13px;color:var(--tx3);font-weight:520;opacity:0;transition:opacity .2s}
body.sc .top .sub{opacity:1}
body.run .top{display:none}

.wrap{padding:calc(var(--nb) + var(--st) + 2px) 16px 28px;max-width:720px;margin:0 auto}
.lt{font-size:34px;line-height:1.08;font-weight:720;letter-spacing:-.03em;margin:4px 2px 18px;
  transform-origin:left top;transition:opacity .2s,transform .25s var(--ez)}
body.sc .lt{opacity:0;transform:scale(.88) translateY(-6px)}
.lt .dt{display:block;font-size:13px;font-weight:620;letter-spacing:.02em;color:var(--tx3);margin-bottom:4px;text-transform:uppercase}

/* ---------- SURFACES ---------- */
.card{background:var(--el1);border-radius:var(--r2);padding:16px;margin-bottom:14px}
:root[data-theme="light"] .card{box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.flat{padding:0;overflow:hidden}
.card h2{font-size:19px;letter-spacing:-.022em}
.ch{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.ch h2{flex:1;min-width:0}
.ch .more{font-size:15px;color:var(--ac);border:0;background:none;padding:0}
.row{display:flex;gap:10px;align-items:center}
.row.w{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{font-size:13px;color:var(--tx2);margin-bottom:6px;display:block;font-weight:500;letter-spacing:-.005em}
.muted{color:var(--tx2)} .dim{color:var(--tx3)}
.s11{font-size:11px}.s12{font-size:13px}.s13{font-size:15px}
.sec{font-size:13px;color:var(--tx2);margin:24px 16px 7px;font-weight:500;text-transform:uppercase;letter-spacing:.03em}
.sec:first-child{margin-top:4px}
.foot{font-size:13px;color:var(--tx3);margin:-6px 16px 16px;line-height:1.38}
.empty{text-align:center;color:var(--tx3);font-size:15px;padding:30px 12px;line-height:1.5}
.empty .ico{width:64px;height:64px;margin:0 auto 10px;display:block;--fg:var(--tx3);--ic:var(--tx3)}
.empty b{display:block;color:var(--tx2);font-size:17px;font-weight:600;margin-bottom:4px}

/* ---------- BUTTONS ---------- */
button.b{background:var(--el2);border:0;border-radius:var(--r);padding:13px 16px;
  font-weight:590;font-size:17px;text-align:center;letter-spacing:-.012em;
  transition:transform .16s var(--ez),opacity .16s,background .16s}
:root[data-theme="light"] button.b:not(.pri):not(.gh):not(.dgr):not(.tint):not(.xs){background:var(--el3)}
button.b:active{transform:scale(.97);opacity:.72}
button.b.pri{background:var(--ac);color:var(--act);font-weight:640}
button.b.gh{background:transparent;color:var(--ac);font-weight:560}
button.b.dgr{color:var(--red);background:transparent;font-weight:560}
button.b.tint{background:var(--acs);color:var(--ac);font-weight:620}
button.b.sm{padding:9px 14px;font-size:15px;border-radius:10px}
button.b.xs{padding:5px 11px;font-size:13px;border-radius:9px;background:var(--el2);color:var(--tx2);font-weight:560}
:root[data-theme="light"] button.b.xs{background:var(--el3)}
button.b.full{width:100%}
button.b.big{padding:16px;font-size:17px;border-radius:14px}
button.b:disabled{opacity:.35}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2.5px solid var(--ac);outline-offset:2px}
.ib{width:34px;height:34px;border-radius:50%;border:0;background:var(--el2);color:var(--tx2);display:inline-grid;place-items:center;flex:none;padding:0}
:root[data-theme="light"] .ib{background:var(--el3)}
.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ib:active{opacity:.6}
.btns{display:flex;gap:10px}
.btns>*{flex:1}

input,select,textarea{background:var(--el2);border:0;border-radius:10px;padding:12px;width:100%;
  font-size:17px;-webkit-appearance:none;appearance:none;outline:none}
:root[data-theme="light"] input,:root[data-theme="light"] select,:root[data-theme="light"] textarea{background:var(--el3)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=date]{min-height:44px}
textarea{resize:none;line-height:1.35}
input::placeholder,textarea::placeholder{color:var(--tx3)}

/* ---------- SEGMENTED ---------- */
.seg{display:flex;background:var(--el2);border-radius:10px;padding:2px;margin-bottom:16px;position:relative}
:root[data-theme="light"] .seg{background:rgba(118,118,128,.12)}
.seg button{flex:1;border:0;background:transparent;color:var(--tx);font-size:14px;font-weight:560;
  padding:7px 4px;border-radius:8px;transition:background .2s var(--ez),box-shadow .2s}
.seg button[aria-pressed="true"]{background:var(--el3);box-shadow:0 2px 6px rgba(0,0,0,.25);font-weight:640}
:root[data-theme="light"] .seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* ---------- TAB BAR ---------- */
.nav{position:fixed;bottom:0;left:0;right:0;z-index:60;height:calc(var(--tb) + var(--sb));
  padding-bottom:var(--sb);background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);display:flex}
.nav:before{content:'';position:absolute;top:0;left:0;right:0;height:.5px;background:var(--sep)}
body.run .nav{display:none}
.nav button{flex:1;background:none;border:0;color:var(--tx3);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:560;letter-spacing:.01em;transition:color .18s}
:root[data-theme="light"] .nav button{color:rgba(60,60,67,.5)}
.nav button svg{width:27px;height:27px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .22s var(--ez)}
.nav button[aria-current="true"]{color:var(--ac)}
.nav button[aria-current="true"] svg{stroke-width:2;fill:currentColor;fill-opacity:.18}
.nav button:active svg{transform:scale(.86)}
.nav .dotlive{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--red);margin:-16px 0 0 22px}

/* ---------- PICTOGRAMMES ---------- */
.ico{width:100%;height:100%;fill:none;stroke-linecap:round;stroke-linejoin:round;--fg:var(--tx);--ic:var(--ac);display:block}
.ico .b path{stroke:var(--fg);stroke-width:3.1}
.ico .f path{opacity:.36}
.ico .hd{fill:var(--fg)}
.ico .q{stroke:var(--ic);stroke-width:2.6}
.ico .qf{fill:var(--ic)}
.ico .qf2{fill:var(--ic);fill-opacity:.9}
.ico .qe{stroke:var(--ic);stroke-width:2;opacity:.78}
.ico .qd{stroke:var(--ic);stroke-width:2;stroke-dasharray:2.5 3;opacity:.82}
.ico .k{stroke:var(--fg);stroke-width:2.2;opacity:.38}
.it{width:44px;height:44px;border-radius:12px;flex:none;padding:5px;position:relative;display:inline-block;vertical-align:middle;
  background:color-mix(in srgb,var(--c,var(--ac)) 15%,transparent);--ic:var(--c,var(--ac))}
.it .ico{--ic:var(--c,var(--ac))}
.it.sm{width:34px;height:34px;border-radius:9px;padding:3px}
.it.lg{width:64px;height:64px;border-radius:16px;padding:7px}
.it.xl{width:88px;height:88px;border-radius:22px;padding:9px}
.c-mus{--c:var(--c-mus)}.c-run{--c:var(--c-run)}.c-erg{--c:var(--c-erg)}.c-hyb{--c:var(--c-hyb)}.c-z2{--c:var(--c-z2)}
.c-ac{--c:var(--ac)}
.istrip{display:flex;gap:4px;margin-top:8px}
.istrip .it{width:30px;height:30px;border-radius:8px;padding:2px}
.istrip .more{font-size:12px;color:var(--tx3);align-self:center;margin-left:2px}

/* ---------- LISTES iOS ---------- */
.list{background:var(--el1);border-radius:var(--r2);overflow:hidden;margin-bottom:14px}
:root[data-theme="light"] .list{box-shadow:0 1px 2px rgba(0,0,0,.04)}
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:52px;position:relative;cursor:pointer;transition:background .12s}
.li.nc{cursor:default}
.li:after{content:'';position:absolute;left:var(--ind,16px);right:0;bottom:0;height:.5px;background:var(--sep2)}
.li:last-child:after{display:none}
.li.hasic{--ind:72px}
.li.hasic.smic{--ind:62px}
.li:not(.nc):active{background:var(--el2)}
:root[data-theme="light"] .li:not(.nc):active{background:var(--el3)}
.li .t{font-size:17px;line-height:1.25}
.li .t.sb{font-weight:590}
.li .m{font-size:13px;color:var(--tx2);margin-top:2px;line-height:1.3}
.li.ses .m{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{font-size:15px;color:var(--tx2);text-align:right;flex:none}
.li .r .num{color:var(--tx2)}
.li .dr{font-size:13px;color:var(--tx3);text-align:right;flex:none;line-height:1.25}
.li .dr b{display:block;font-weight:600;color:var(--tx2);font-size:15px}
.li.ann{opacity:.62}
.li input{background:transparent;text-align:right;padding:6px 0;width:96px;flex:none;font-family:var(--mono);font-size:17px;color:var(--tx2)}
.li input:focus{color:var(--ac)}
:root[data-theme="light"] .li input,:root[data-theme="light"] .sheet .li input{background:transparent}
.li select{background-color:transparent;text-align:right;color:var(--tx2)}
.li .u{font-size:15px;color:var(--tx3);flex:none;min-width:34px}
.chev{width:8px;height:13px;flex:none;opacity:.32;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.li.red .t{color:var(--red)} .li.acc .t{color:var(--ac)}
.li.ctr{justify-content:center}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,var(--ac))}

/* switch iOS */
.sw{width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.32);border:0;position:relative;flex:none;transition:background .25s var(--ez);padding:0}
.sw:after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .28s var(--ez)}
.sw[aria-checked="true"]{background:var(--grn)}
.sw[aria-checked="true"]:after{transform:translateX(20px)}

/* ---------- BILAN ---------- */
.weeknav{display:flex;align-items:center;gap:8px;margin:-6px 0 14px}
.weeknav .wl{flex:1;text-align:center;font-size:15px;font-weight:590}
.weeknav .wl small{display:block;font-size:12px;color:var(--tx3);font-weight:500;margin-top:1px}
.hero{display:flex;align-items:center;gap:18px}
.ring{width:108px;height:108px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg);display:block}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-family:var(--mono);font-size:28px;font-weight:680;letter-spacing:-.05em;line-height:1}
.ring .v i{font-size:11px;font-style:normal;color:var(--tx3);margin-top:3px;font-weight:560}
.ring circle{transition:stroke-dashoffset .9s var(--ez)}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.pil{text-align:center;font-size:11px;color:var(--tx3);font-weight:560}
.pil .it{display:block;margin:0 auto 5px;width:40px;height:40px;opacity:.38;filter:grayscale(1);transition:all .3s var(--ez)}
.pil.on{color:var(--tx2)}
.pil.on .it{opacity:1;filter:none}
.pil .n{font-family:var(--mono);color:var(--tx);font-size:13px;display:block;margin-top:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--el1);border-radius:var(--r2);padding:13px 14px}
:root[data-theme="light"] .tile{box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tile .k{font-size:13px;color:var(--tx2);font-weight:560;display:flex;align-items:center;gap:6px}
.tile .k .dot{width:7px;height:7px}
.tile .v{font-family:var(--mono);font-size:26px;font-weight:660;letter-spacing:-.045em;margin-top:6px;line-height:1.05}
.tile .u{font-size:13px;color:var(--tx3);font-family:var(--sans);font-weight:520;margin-left:3px;letter-spacing:0}
.tile .s{font-size:12px;color:var(--tx3);margin-top:3px}
.tile .v.lg{font-size:20px;letter-spacing:-.035em}
.bar{height:8px;border-radius:5px;background:var(--el3);overflow:hidden;margin-top:10px}
.bar b{display:block;height:100%;border-radius:5px;background:var(--c-z2);transition:width .9s var(--ez)}
.prog{height:4px;border-radius:2px;background:var(--el3);overflow:hidden}
.prog b{display:block;height:100%;background:var(--ac);border-radius:2px;transition:width .5s var(--ez)}

/* ---------- GRAPHIQUES ---------- */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--sep2);stroke-width:1}
.chart .ax{fill:var(--tx3);font-size:10px;font-family:var(--sans);letter-spacing:0}
.chart .axr{text-anchor:end}
.chart .axm{text-anchor:middle}
.chart .bk{transition:opacity .2s}
.chart.has-sel .bk{opacity:.4}
.chart.has-sel .bk.sel{opacity:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart .goal{stroke:var(--tx2);stroke-width:1.2;stroke-dasharray:4 4}
.chart .goalt{fill:var(--tx2);font-size:10px;text-anchor:end}
.chart .ln{fill:none;stroke:var(--c,var(--ac));stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--c,var(--ac));opacity:.1}
.chart .pt{fill:var(--el1);stroke:var(--c,var(--ac));stroke-width:2}
.chart .pt.pr{fill:var(--c,var(--ac))}
.cinfo{display:flex;align-items:baseline;gap:8px;min-height:40px;margin:-2px 0 8px}
.cinfo .big{font-family:var(--mono);font-size:24px;font-weight:660;letter-spacing:-.04em}
.cinfo .u{font-size:13px;color:var(--tx3);font-weight:520}
.cinfo .sm{font-size:13px;color:var(--tx2);margin-left:auto;text-align:right;line-height:1.25}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--tx2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--el3);display:block}
.heat i.l1{background:color-mix(in srgb,var(--ac) 30%,var(--el3))}
.heat i.l2{background:color-mix(in srgb,var(--ac) 55%,var(--el3))}
.heat i.l3{background:color-mix(in srgb,var(--ac) 78%,var(--el3))}
.heat i.l4{background:var(--ac)}
.heat i.fut{background:transparent}
.heat i.td{box-shadow:0 0 0 1.5px var(--tx2)}
.heatm{display:grid;grid-auto-flow:column;gap:3px;font-size:10px;color:var(--tx3);margin-bottom:4px}
.heatl{display:flex;align-items:center;gap:3px;justify-content:flex-end;font-size:11px;color:var(--tx3);margin-top:8px}
.heatl i{width:11px;height:11px;border-radius:3px;display:inline-block}
.tl{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;margin-top:9px}
.tl i{display:block;height:100%;min-width:2px;border-radius:1.5px}
.tl.lg{height:12px;border-radius:6px}
.k-rec{background:var(--rec)}.k-z2{background:var(--z2)}.k-seuil{background:var(--seuil)}.k-work{background:var(--work)}
.tl.lg i{border-radius:2px}

/* ---------- TAGS ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:7px;
  background:var(--el2);color:var(--tx2);white-space:nowrap}
:root[data-theme="light"] .tag{background:var(--el3)}
.tag.ac{background:var(--acs);color:var(--ac)}
.tag.cat{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--tx)}

.tags{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:11px;font-weight:720;padding:3px 7px;border-radius:6px;background:var(--pr);color:#231D00;letter-spacing:.02em}
.delta{font-family:var(--mono);font-size:12px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--el2);color:var(--tx2)}
:root[data-theme="light"] .delta{background:var(--el3)}
.delta.up{background:color-mix(in srgb,var(--grn) 18%,transparent);color:var(--tx)}
.setc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.setc span{font-family:var(--mono);font-size:13px;padding:5px 9px;border-radius:8px;background:var(--el2);color:var(--tx);letter-spacing:-.02em}
:root[data-theme="light"] .setc span{background:var(--el3)}
.setc span.pr{background:color-mix(in srgb,var(--pr) 26%,transparent)}
.setc span.wu{color:var(--tx3)}

/* ---------- RENFO ---------- */
.live{background:var(--el1);border-radius:var(--r2);padding:14px 16px;margin-bottom:14px}
.live .clk{font-family:var(--mono);font-size:34px;font-weight:660;letter-spacing:-.05em;line-height:1}
.live .st3{display:flex;gap:18px;margin:12px 0 10px}
.live .st3 div{font-size:12px;color:var(--tx3);font-weight:560}
.live .st3 b{display:block;font-family:var(--mono);font-size:17px;color:var(--tx);font-weight:640;letter-spacing:-.03em;margin-top:2px}
.exo{border-radius:var(--r2);margin-bottom:10px;background:var(--el1);overflow:hidden;transition:box-shadow .25s var(--ez)}
.exo.act{box-shadow:0 0 0 2px var(--ac)}

.exo>header{padding:12px 12px 12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.exo>header:active{background:var(--el2)}
.exo>header .n{font-size:17px;font-weight:600;line-height:1.2}
.exo>header .sub{font-size:13px;color:var(--tx2);margin-top:3px}
.exo>header .sub b{color:var(--ac);font-weight:620}
.tick{min-width:26px;height:26px;border-radius:13px;background:var(--el3);flex:none;display:grid;place-items:center;padding:0 7px;
  font-size:13px;font-weight:660;color:var(--tx3);font-family:var(--mono);transition:all .3s var(--ez)}
.tick.on{background:var(--ac);color:var(--act)}
.sets{padding:0 16px}
.set{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:.5px solid var(--sep2);font-size:17px}
.set .i{width:18px;color:var(--tx3);font-size:13px;font-family:var(--mono)}
.set button.i{width:26px;height:26px;margin:-4px 0 -4px -4px;padding:0;border:0;background:none;border-radius:8px;color:var(--tx3);font-size:13px;font-family:var(--mono);flex:none}
.set button.i.w,.edr button.n.w{color:var(--ac);font-weight:700;background:var(--acs)}
.set.wu .v{color:var(--tx3)}
.edr button.n{width:26px;height:30px;padding:0;border:0;background:none;border-radius:8px;color:var(--tx3);font-size:13px;font-family:var(--mono);flex:none}
.hint .hw{opacity:.62}
.wuh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);margin:0 0 10px;padding:7px 8px 7px 11px;border-radius:10px;background:var(--el2)}
:root[data-theme="light"] .wuh{background:var(--el3)}
.wuh b{color:var(--tx);font-family:var(--mono);font-weight:600;letter-spacing:-.02em}
.li input.rg{width:40px;text-align:center}
.set .v{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.set.new{animation:pop .42s var(--ez)}
@keyframes pop{0%{opacity:0;transform:translateY(-10px) scale(.97)}100%{opacity:1;transform:none}}
.ent{padding:12px 16px 16px;border-top:.5px solid var(--sep2)}
.sug{display:flex;align-items:center;gap:8px;background:var(--acs);border-radius:10px;padding:9px 11px;margin-bottom:10px;font-size:13px;color:var(--tx);line-height:1.3}
.sug svg{width:16px;height:16px;flex:none;stroke:var(--ac);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sug b{color:var(--ac);font-weight:680}
.hint{font-size:12px;color:var(--tx3);margin:0 0 10px;font-family:var(--mono);letter-spacing:-.02em}
.stp{display:flex;align-items:stretch;background:var(--el2);border-radius:12px;overflow:hidden;flex:1;min-width:0}
:root[data-theme="light"] .stp{background:var(--el3)}
.stp button{width:46px;flex:none;background:transparent;border:0;font-size:24px;font-weight:300;color:var(--ac);transition:background .12s;padding:0}
.stp button:active{background:var(--el3)}
.stp .f{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 6px;min-width:0}
.stp input{border:0;background:none;text-align:center;font-family:var(--mono);font-size:24px;font-weight:650;
  padding:0;height:30px;border-radius:0;letter-spacing:-.045em}
.stp .u{font-size:11px;color:var(--tx3);font-weight:560}
.stp.sm button{width:38px;font-size:20px}
.stp.sm input{font-size:17px;height:24px}
.stp.sm .f{padding:6px 0}
.mcard{display:flex;gap:12px;align-items:center;padding:14px 16px;position:relative;cursor:pointer}
.mcard:after{content:'';position:absolute;left:16px;right:0;bottom:0;height:.5px;background:var(--sep2)}
.mcard:last-child:after{display:none}
.mcard:active{background:var(--el2)}

/* ---------- BARRE REPOS ---------- */
.abar{position:fixed;left:8px;right:8px;bottom:calc(var(--tb) + var(--sb) + 8px);z-index:59;
  background:var(--glass2);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-radius:20px;padding:10px 12px;display:flex;align-items:center;gap:10px;overflow:hidden;
  box-shadow:var(--shadow);animation:slideup .4s var(--ez)}
@keyframes slideup{from{transform:translateY(130%)}to{transform:none}}
.abar .rg{width:44px;height:44px;flex:none;position:relative}
.abar .rg svg{transform:rotate(-90deg);display:block}
.abar .rg circle{transition:stroke-dashoffset .25s linear}
.abar .t{font-family:var(--mono);font-size:26px;font-weight:660;color:var(--tx);font-variant-numeric:tabular-nums;letter-spacing:-.05em;min-width:72px}
.abar.end .t{color:var(--ac)}
.abar .nx{font-size:11px;line-height:1.25;color:var(--tx3);min-width:0;overflow:hidden;font-weight:560;text-transform:uppercase;letter-spacing:.03em}
.abar .nx b{display:block;color:var(--tx);font-size:13px;font-weight:560;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:none;letter-spacing:-.01em}
.abar .b.xs{padding:7px 9px}
.abar .nx b{font-size:14px}

/* ---------- CTA ---------- */
.cta{position:fixed;left:0;right:0;bottom:calc(var(--tb) + var(--sb));z-index:58;padding:10px 16px 12px;
  background:linear-gradient(to top,var(--bg) 60%,transparent);display:flex;gap:10px;animation:slideup .4s var(--ez)}
.cta .b{box-shadow:0 6px 20px rgba(0,0,0,.25)}
.cta .ib{width:52px;height:52px;background:var(--el1)}
.cta .ib svg{width:20px;height:20px}

/* ---------- v1.11 : clavier intégré, techniques, notes ---------- */
.kp{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;animation:kpf .18s ease-out}
@keyframes kpf{from{opacity:0}to{opacity:1}}
.kpp{width:100%;background:var(--el1);border-radius:18px 18px 0 0;padding:10px 12px calc(12px + var(--sb));animation:sup .3s var(--ez);box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.kph{display:flex;align-items:baseline;gap:8px;padding:6px 6px 12px}
.kph .l{flex:1;min-width:0;font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpv{font-family:var(--mono);font-size:38px;font-weight:680;letter-spacing:-.045em;line-height:1;color:var(--tx)}
.kpv.fresh{color:var(--ac)}
.kph .u{font-size:14px;color:var(--tx3)}
.kpg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpg button{height:56px;border:0;border-radius:13px;background:var(--el2);font-size:25px;font-family:var(--mono);font-weight:560;color:var(--tx);touch-action:manipulation;transition:transform .08s}
:root[data-theme="light"] .kpg button{background:var(--el3)}
.kpg button:active{transform:scale(.95);background:var(--el3)}
.kpc{display:flex;gap:6px;margin:0 0 10px;flex-wrap:wrap}
.kpc button{border:0;border-radius:9px;padding:7px 11px;background:var(--acs);color:var(--ac);font-size:13px;font-weight:620;font-family:var(--mono)}
.stp .f input[readonly],.li input[readonly],.edr input[readonly]{cursor:pointer;-webkit-user-select:none;user-select:none;caret-color:transparent}
.tqt{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:6px;font-size:11px;font-weight:650;font-family:var(--sans);letter-spacing:.01em;vertical-align:2px;background:color-mix(in srgb,var(--c-erg) 22%,transparent);color:var(--c-erg)}
.tqt.cap{background:color-mix(in srgb,var(--org) 20%,transparent);color:var(--org);vertical-align:3px}
.seg.tqs{margin:0 0 10px}
.seg.tqs button{font-size:13px;padding:7px 2px}
.enote{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.35;color:var(--tx2);background:var(--el2);border-radius:10px;padding:8px 10px;margin:0 0 10px}
:root[data-theme="light"] .enote{background:var(--el3)}
.enote svg{width:16px;height:16px;flex:none;margin-top:1px;fill:none;stroke:var(--tx3);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.capq{display:flex;gap:10px;align-items:center;font-size:13px;line-height:1.35;color:var(--tx);background:color-mix(in srgb,var(--org) 14%,var(--el1));border-radius:12px;padding:10px 10px 10px 12px;margin:0 0 10px}
.edr button.n.tq{color:var(--c-erg)}

/* ---------- v1.12 : objectifs, séances VO2 ---------- */
.gref{display:flex;align-items:center;gap:10px;margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--acs);color:var(--tx);font-size:14px;cursor:pointer}
.gref b{font-family:var(--mono);font-size:17px;color:var(--ac);letter-spacing:-.03em}
.gref small{display:block;font-size:12px;color:var(--tx2);margin-top:2px}
.gref svg{flex:none}
.goal{padding:14px 16px}
.gbig{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:8px}
.gbig .s12{flex-basis:100%}
.gbig b{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:-.05em;line-height:1.05}
.gk3{display:flex;gap:8px}
.gk3>div{flex:1;min-width:0;background:var(--el2);border-radius:12px;padding:8px 10px;font-size:11px;color:var(--tx3);font-weight:600}
:root[data-theme="light"] .gk3>div{background:var(--el3)}
.gk3 b{display:block;font-family:var(--mono);font-size:18px;color:var(--tx);font-weight:660;letter-spacing:-.04em;margin-top:2px}
.gk3 b.acc{color:var(--ac)}
.gk3 small{display:block;font-size:11px;color:var(--tx3);font-weight:500;margin-top:1px}
.glog{display:flex;align-items:center;gap:5px;margin-top:12px}
.glog i{width:12px;height:12px;border-radius:4px;background:var(--el3)}
.glog i.ahead{background:var(--grn)}.glog i.behind{background:var(--red)}.glog i.hold{background:var(--tx3)}
.glog span{margin-left:6px}
.tag.ok{background:color-mix(in srgb,var(--grn) 20%,transparent);color:var(--grn)}
.tag.warn{background:color-mix(in srgb,var(--org) 20%,transparent);color:var(--org)}
.li.nextlib{background:color-mix(in srgb,var(--ac) 7%,var(--el1))}

/* ---------- TOM HOLLAND ---------- */
.wtap.rest{border-color:color-mix(in srgb,var(--rec) 55%,transparent)}
.wtap.rest .n{color:var(--rec)}
.runner.wod{overflow-y:auto}
.clock.sm{font-size:clamp(54px,18vw,92px);margin-top:10px}
.wscore{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:4px}
.wscore b{font-family:var(--mono);font-size:40px;font-weight:700;letter-spacing:-.05em;line-height:1}
.wscore span{font-size:15px;color:var(--tx2);font-weight:560}
.wscore.big b{font-size:76px;color:var(--c-hyb)}
.wk3{display:flex;gap:8px;margin-top:10px}
.wk3>div{flex:1;min-width:0;background:var(--el1);border-radius:14px;padding:8px 6px;font-size:11px;color:var(--tx3);font-weight:600;text-align:center}
.wk3 b{display:block;font-family:var(--mono);font-size:19px;color:var(--tx);font-weight:660;letter-spacing:-.04em;margin:2px 0 0;white-space:nowrap}
.wk3 small{font-size:11px;color:var(--tx3);font-weight:500}
.wk3 b.ahead{color:var(--c-z2)}.wk3 b.behind{color:var(--red)}
.wtap{flex:1;min-height:210px;margin-top:12px;border-radius:26px;background:var(--el1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation;cursor:pointer;position:relative;
  border:1.5px solid color-mix(in srgb,var(--c-hyb) 45%,transparent);transition:transform .12s var(--ez),background .12s}
.wtap:active{transform:scale(.975);background:var(--el2)}
.wtap .it{width:60px;height:60px}
.wtap .n{font-family:var(--mono);font-size:68px;font-weight:720;line-height:.95;letter-spacing:-.05em;color:var(--c-hyb)}
.wtap .l{font-size:22px;font-weight:660;letter-spacing:-.02em}
.wtap .nx{font-size:14px;color:var(--tx2);margin-top:2px}
.wtap .ht{position:absolute;bottom:12px;font-size:12px;color:var(--tx3)}
.wdots{position:absolute;top:14px;display:flex;gap:6px}
.wdots i{width:26px;height:5px;border-radius:3px;background:var(--el3)}
.wdots i.on{background:var(--c-hyb)}.wdots i.cur{background:var(--tx2)}
.wlad{display:flex;align-items:flex-end;gap:3px;height:44px;margin-top:10px}
.wlad i{flex:1;background:var(--el3);border-radius:3px 3px 1px 1px;min-height:4px}
.wlad i.on{background:var(--c-hyb)}.wlad i.cur{background:var(--tx2)}
.wcdw{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;user-select:none;-webkit-user-select:none}
.wcd{font-family:var(--mono);font-size:clamp(120px,40vw,200px);font-weight:720;line-height:1;letter-spacing:-.06em;color:var(--c-hyb)}
.runner.paused .wtap{opacity:.45;pointer-events:none}
.hbar{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:13px}
.hbar .lb{width:84px;color:var(--tx2);flex:none}
.hbar .tr{flex:1;height:10px;border-radius:5px;background:var(--el3);overflow:hidden}
.hbar .tr b{display:block;height:100%;border-radius:5px;background:var(--c-hyb)}
.hbar .tr b.h{background:var(--tx3)}
.hbar .v{font-family:var(--mono);width:52px;text-align:right;flex:none}

/* ---------- RUNNER ---------- */
.runner{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;
  padding:calc(var(--st) + 12px) 16px calc(var(--sb) + 12px);animation:fadein .35s var(--ez)}
@keyframes fadein{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}
.rhead{display:flex;align-items:center;gap:10px}
.rhead .t{font-size:15px;font-weight:600}
.rhead .m{font-size:12px;color:var(--tx3);margin-top:1px}
.rmid{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:14px}
.rmid .it{width:40px;height:40px}
.rphase{font-size:21px;font-weight:660;letter-spacing:-.024em}
.rsub{text-align:center;font-size:14px;color:var(--tx2);margin-top:4px;min-height:18px;line-height:1.35;padding:0 8px}
.clock{text-align:center;font-family:var(--mono);font-size:clamp(66px,23vw,118px);line-height:.94;
  font-weight:620;font-variant-numeric:tabular-nums;letter-spacing:-.06em;margin-top:4px}
.clock.work{color:var(--work)}.clock.rec{color:var(--rec)}.clock.z2{color:var(--z2)}.clock.seuil{color:var(--seuil)}
.clock.up{color:var(--tx)}
.runner.paused .clock{opacity:.45}
.tgt{background:var(--el1);border-radius:var(--r2);padding:13px;margin-top:12px;text-align:center}
.tgt .m{font-family:var(--mono);font-size:28px;font-weight:660;letter-spacing:-.045em;line-height:1.1}
.tgt .m2{font-family:var(--mono);font-size:15px;color:var(--tx2);margin-top:3px;letter-spacing:-.02em}
.tgt .fc{font-family:var(--mono);font-size:13px;color:var(--tx3);margin-top:6px}
.pbar{display:flex;gap:2px;margin-top:12px;height:6px}
.pbar i{flex:1;background:var(--el3);border-radius:3px;overflow:hidden;position:relative}
.pbar i.w{flex:1.6}
.pbar i b{position:absolute;inset:0;transform-origin:left;background:var(--tx3);transform:scaleX(0);border-radius:3px}
.pbar i.w b{background:var(--work)} .pbar i.r b{background:var(--rec)} .pbar i.z b{background:var(--z2)} .pbar i.s b{background:var(--seuil)}
.next{text-align:center;font-size:12px;color:var(--tx3);font-family:var(--mono);margin-top:10px;letter-spacing:-.01em}
.rlist{margin-top:12px;overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;background:var(--el1);border-radius:var(--r2);padding:2px 14px}
.rl{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:.5px solid var(--sep2);color:var(--tx2);font-size:13px}
.rl:first-child{border-top:0}
.rl .kb{width:4px;height:22px;border-radius:2px;flex:none}
.rl .tg{font-family:var(--mono);color:var(--tx3);letter-spacing:-.02em;font-size:12px}
.rl .d{color:var(--tx3);min-width:42px;text-align:right;font-family:var(--mono);font-size:12px}
.rl.past{opacity:.3} .rl.cur{color:var(--tx);font-weight:640}
.laps{display:flex;align-items:center;gap:12px;margin-top:10px;background:var(--el1);border-radius:var(--r2);padding:10px 14px}
.laps .c{font-family:var(--mono);font-size:32px;font-weight:670;letter-spacing:-.05em}

/* ---------- PLAN ---------- */
.prow{display:flex;align-items:center;gap:12px;padding:8px 16px;min-height:54px;position:relative}
.prow:after{content:'';position:absolute;left:16px;right:0;bottom:0;height:.5px;background:var(--sep2)}
.prow:last-child:after{display:none}
.prow .t{flex:1;font-size:16px;min-width:0}
.prow .stp{flex:none;width:148px}
.plst{display:flex;align-items:center;gap:12px;padding:10px 16px;position:relative}
.plst:after{content:'';position:absolute;left:16px;right:0;bottom:0;height:.5px;background:var(--sep2)}
.plst:last-child:after{display:none}
.plst .kb{width:4px;align-self:stretch;border-radius:2px;flex:none;min-height:30px}
.plst .t{font-size:15px;line-height:1.25}
.plst .m{font-size:12px;color:var(--tx3);font-family:var(--mono);margin-top:2px;letter-spacing:-.02em}
.plst .d{font-family:var(--mono);font-size:14px;color:var(--tx2);flex:none;letter-spacing:-.02em}
.plst.grp{background:color-mix(in srgb,var(--el2) 60%,transparent)}
.phero{display:flex;gap:14px;align-items:center}
.phero .k3{display:flex;gap:16px;margin-top:8px}
.phero .k3 div{font-size:12px;color:var(--tx3);font-weight:560}
.phero .k3 b{display:block;font-family:var(--mono);font-size:16px;color:var(--tx);font-weight:640;letter-spacing:-.03em;margin-top:1px}

/* ---------- SHEET ---------- */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.42);display:flex;align-items:flex-end;animation:fade .3s var(--ez)}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet>div{background:var(--el1);width:100%;max-height:92dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  border-radius:14px 14px 0 0;padding:8px 16px calc(24px + var(--sb));animation:sup .44s var(--ez);position:relative;will-change:transform}

<body>
<div class="top"><button class="bk" id="tbk" style="display:none"></button><h1 id="ttl">Carnet</h1><span class="sub" id="tsub"></span></div>

<script>
"use strict";
/* ================= UTILS ================= */
var CH='<svg class="chev" viewBox="0 0 8 13"><path d="M1.5 1.5 6 6.5 1.5 11.5"/></svg>';
var _n=0; function uid(){_n++;return 'x'+Date.now().toString(36)+_n.toString(36)}
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return n<10?'0'+n:''+n}
function mmss(s){s=Math.max(0,Math.ceil(s));return pad(Math.floor(s/60))+':'+pad(s%60)}
function hms(s){s=Math.max(0,Math.round(s));var h=Math.floor(s/3600);return (h?h+':'+pad(Math.floor(s%3600/60)):Math.floor(s/60))+':'+pad(s%60)}
function today(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function dshort(iso){var p=iso.split('-');return p[2]+'/'+p[1]}
function dayAgo(iso){return Math.round((new Date(today())-new Date(iso))/864e5)}
function monday(d){d=new Date(d);var g=(d.getDay()+6)%7;d.setDate(d.getDate()-g);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
var MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function hlong(s){s=Math.round(s/60);var h=Math.floor(s/60),m=s%60;
  return h?(h+' h'+(m?' '+pad(m):'')):(m+' min')}
function nfmt(v){return (Math.round(v*10)/10).toString().replace('.',',')}

/* ================= STATE ================= */
var KEY='carnet-v1', SCHEMA=14, VERSION='1.14.0';
var SEED=[
 ['Développé couché','Pecs','kg',150,2.5],['Développé incliné','Pecs','kg',150,2.5],['Chest press','Pecs','kg',120,5],
 ['Strict press','Épaules','kg',150,2.5],['Pompes','Pecs','bw',90,0],['Dips','Pecs','bw',120,2.5],
 ['Row unilatéral','Dos','kg',120,2.5],['Lat pulldown','Dos','kg',120,5],['Tractions','Dos','bw',150,2.5],['Chin ups','Dos','bw',150,2.5],
 ['Élévation latérale','Épaules','kg',60,1],
 ['Back squat','Jambes','kg',180,2.5],['Front squat','Jambes','kg',180,2.5],['Presse à cuisses','Jambes','kg',180,5],
 ['Leg extension','Jambes','kg',120,5],['Leg curl','Jambes','kg',120,5],['Hip abductor','Jambes','kg',90,5],
 ['Soulevé de terre roumain','Jambes','kg',180,2.5],['Bulgarian split squat','Unilatéral','kg',120,2],
 ['Reverse lunge','Unilatéral','kg',120,2],['Step up','Unilatéral','kg',120,2],['Pistol squat','Unilatéral','bw',120,2.5],
 ['Fentes marchées','Unilatéral','kg',120,2],['Mollets debout','Jambes','kg',90,5],
 ['Sled push','Spécifique','kg',120,5],['Sled pull','Spécifique','kg',120,5],['Farmer carry','Spécifique','kg',90,4],
 ['Wall ball','Spécifique','kg',60,1],['Sandbag lunges','Spécifique','kg',90,5],['Burpee broad jump','Spécifique','bw',60,0],['Burpees to plate','Spécifique','bw',60,0],['Goblet squat','Jambes','kg',120,4],
 ['Planche','Tronc','sec',60,0],['Hollow hold','Tronc','sec',60,0],['Sit-up','Tronc','bw',60,0],['Abdominal machine','Tronc','kg',90,5],
 ['Marche sur les talons','Tibial','sec',45,0],['Dorsiflexion élastique','Tibial','bw',45,0],['Tap orteils unilatéral','Tibial','bw',45,0],
 ['KB swing','Kettlebell','kg',90,4],['KB clean & press','Kettlebell','kg',90,4],['KB goblet squat','Kettlebell','kg',90,4],['KB snatch','Kettlebell','kg',90,4]
];
var SEEDREST={};SEED.forEach(function(e){SEEDREST[e[0]]=e[3]});
function seedExos(){return SEED.map(function(e){return {id:uid(),nom:e[0],groupe:e[1],unite:e[2],rest:0,inc:e[4],ic:'',rmin:0,rmax:0,cmax:0,uni:0,note:'',cmaxNo:0}})}
var MODAL=['Course extérieur','Course tapis','Echo bike','Rameur','Ski erg','Vélo','Mini elliptique','Salle / plateau','Marche','Escalier','Autre'];

function fresh(){return{schema:SCHEMA,exos:seedExos(),seances:[],blocs:[],modeles:[],cur:null,timer:null,
  prefs:{theme:'auto',rest:120,fcmax:0,w4:0,rpm4:0,vma:0,poids:0,z2goal:180,lock:1,row500:0,ski500:0,th:thDef()},wod:null,goals:{}}}
function thDef(){return {cmin:20,cver:'rx',cgoal:0,ltop:10,lver:'rx',hset:3,hpu:12,hlr:10,hpp:25,hrest:4,hsq:100,hver:'rx',wset:4,wsw:25,wpp:15,wrest:60,wkg:16,wver:'rx'}}
function migrate(s){
  if(!s.prefs)s.prefs={};
  var dp={theme:'auto',rest:120,fcmax:0,w4:0,rpm4:0,vma:0,poids:0,z2goal:180,lock:1,row500:0,ski500:0};
  for(var k in dp) if(s.prefs[k]===undefined) s.prefs[k]=dp[k];
  if(!Array.isArray(s.exos)||!s.exos.length)s.exos=seedExos();
  var old=s.schema||0;
  s.exos.forEach(function(e){ if(e.inc===undefined)e.inc=(e.unite==='kg'?2.5:(e.unite==='lvl'?1:0)) });
  /* schéma 5 : e.rest=0 signifie "utiliser le repos par défaut des réglages".
     Les valeurs héritées identiques au catalogue d'origine repassent donc sur le défaut global. */
  if(old<5)s.exos.forEach(function(e){ if(!e.rest||SEEDREST[e.nom]===e.rest)e.rest=0 });
  /* complète le catalogue avec les nouveautés du schéma 3 */
  SEED.forEach(function(d){ if(!s.exos.some(function(e){return e.nom===d[0]}))
    s.exos.push({id:uid(),nom:d[0],groupe:d[1],unite:d[2],rest:0,inc:d[4],ic:'',rmin:0,rmax:0}) });
  if(!Array.isArray(s.seances))s.seances=[];
  if(!Array.isArray(s.blocs))s.blocs=[];
  if(!Array.isArray(s.modeles))s.modeles=[];
  if(old<7)s.seances.forEach(function(x){
    if(x.type!=='cardio')return;
    if(/^\s*(warm ?up|cool ?down|échauffement|echauffement|retour au calme)\b/i.test(x.note||'')&&(x.duree||0)<=1800)x.ann=1;
    if(x.ann&&!x.z2)x.z2=Math.round((x.duree||0)/60);
  });
  /* schéma 8 : pictogramme choisi par exercice (ic), vide = deviné depuis le nom */
  s.exos.forEach(function(e){ if(e.ic===undefined)e.ic='' });
  if(['auto','dark','light'].indexOf(s.prefs.theme)<0)s.prefs.theme='auto';
  if(s.cur===undefined)s.cur=null; if(s.timer===undefined)s.timer=null;
  /* schéma 9 : fourchette de reps par exercice (0 = déduite de l'historique), séries d'échauffement (set.w, set.wx si choisi à la main),
     splits de référence rameur et ski erg. Corrections de saisie cardio constatées à l'usage. */
  s.exos.forEach(function(e){ if(e.rmin===undefined)e.rmin=0; if(e.rmax===undefined)e.rmax=0 });
  if(old<9){
    s.seances.forEach(function(x){
      if(x.type!=='cardio')return;
      if(x.modalite==='Autre'&&/escalier|étages|etages|stair/i.test(x.note||''))x.modalite='Escalier';
      if(x.cat==='Course'&&!isRun(x.modalite))delete x.cat;
      var pl=(x.plan||[]).reduce(function(a,p){return a+(+p.s||0)},0);
      if(!(+x.duree>0)&&pl>0)x.duree=pl;
      if(x.cat==='Zone 2'&&!(x.plan&&x.plan.length)&&!(+x.z2>0)&&(+x.duree>0))x.z2=Math.round(x.duree/60);
    });
    s._m9=1;
  }
  /* schéma 10 : module Tom Holland (réglages prefs.th, séance en cours S.wod, résultat seance.wod) */
  if(!s.prefs.th||typeof s.prefs.th!=='object')s.prefs.th={};
  var td=thDef(); for(var tk in td) if(s.prefs.th[tk]===undefined) s.prefs.th[tk]=td[tk];
  if(s.wod===undefined)s.wod=null;
  /* schéma 14 : routine réveil (wset, wsw, wpp, wrest en s, wkg, wver), ajoutée par la boucle thDef ci-dessus */
  /* schéma 11 : charge max machine (cmax), unilatéral possible (uni), note d'exercice, réponse « pas le max » (cmaxNo), technique par série (set.tq) */
  s.exos.forEach(function(e){ if(e.cmax===undefined)e.cmax=0; if(e.uni===undefined)e.uni=0; if(e.note===undefined)e.note=''; if(e.cmaxNo===undefined)e.cmaxNo=0 });
  /* schéma 12 : objectifs datés par repère (goals), séance de bibliothèque d'origine (lib), effort réalisé (eff, efft, effr) */
  if(!s.goals||typeof s.goals!=='object')s.goals={};
  s.schema=SCHEMA; return s;
}
function load(){try{var r=JSON.parse(localStorage.getItem(KEY));if(r&&r.schema)return migrate(r)}catch(e){}return fresh()}
var S=load();
var _boot=S;
fix9();
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Sauvegarde impossible')}}
function exo(id){for(var i=0;i<S.exos.length;i++)if(S.exos[i].id===id)return S.exos[i];return null}
function exoByName(n){for(var i=0;i<S.exos.length;i++)if(S.exos[i].nom===n)return S.exos[i];return null}

/* ================= RECORDS ================= */
function e1rm(kg,reps){return kg*(1+reps/30)}
function prOf(exoId,inclCur){
  var e=exo(exoId), best={charge:0,reps:0,e1:0,date:null}; if(!e)return best;
  function scan(sets,date){ (sets||[]).forEach(function(st){
    if(st.exoId!==exoId||st.w||st.tq)return; var kg=+st.charge||0, rp=+st.reps||0;
    if(kg>best.charge)best.charge=kg;
    if(e.unite==='kg'){var v=e1rm(kg,rp); if(v>best.e1){best.e1=v;best.reps=rp;best.date=date}}
    else if(rp>best.reps){best.reps=rp;best.date=date}
  })}
  S.seances.forEach(function(s){if(s.type==='renfo')scan(s.sets,s.date)});
  if(inclCur&&S.cur)scan(S.cur.sets,S.cur.date);
  return best;
}
/* Séries d'échauffement : hors volume, records et progression.
   Règle a posteriori par exercice : seules les séries placées avant la première série de travail peuvent être des échauffements
   (charge < 80 % de la charge max du jour, reps < moitié des reps lourdes, ou dominée par une série suivante plus lourde et au moins aussi longue).
   addOnly : ne retire jamais un marquage existant. wx : choix manuel, jamais modifié. */
function warmMark(sets,addOnly){
  var by={};(sets||[]).forEach(function(x){(by[x.exoId]=by[x.exoId]||[]).push(x)});
  Object.keys(by).forEach(function(id){var e=exo(id),l=by[id];
    if(!e||e.unite!=='kg')return;
    var mx=Math.max.apply(null,l.map(function(x){return +x.charge||0}));if(!mx)return;
    var hv=l.filter(function(x){return (+x.charge||0)>=mx*.9}),rm=Math.max.apply(null,hv.map(function(x){return +x.reps||0}));
    var fw=-1;for(var i=0;i<l.length;i++){if((+l[i].charge||0)>=mx*.9&&(+l[i].reps||0)>=rm*.5){fw=i;break}}
    l.forEach(function(x,i){ if(x.wx||x.tq)return; var w=0,c=+x.charge||0,r=+x.reps||0;
      if(i<fw)w=(c<mx*.8||r<rm*.5||l.slice(i+1).some(function(y){return (+y.charge||0)>c&&(+y.reps||0)>=r}))?1:0;
      if(w)x.w=1;else if(!addOnly)delete x.w });
  });
}
function warmGuess(e,exoId,c){
  if(!e||e.unite!=='kg'||!c||!S.cur)return 0;
  if(S.cur.sets.some(function(x){return x.exoId===exoId&&!x.w}))return 0;
  var pg=progression(exoId,S.cur.blocId||null),ref=pg?pg.next:0;
  return ref&&c<ref*.8?1:0;
}
function fix9(){ if(!S||!S._m9)return; delete S._m9;
  var ss=S.seances.filter(function(x){return x.type==='renfo'}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
  ss.forEach(function(x){warmMark(x.sets)}); ss.forEach(function(x){recalcPR(x)}); save();
}
function lastSetsFor(exoId,blocId){
  for(var i=S.seances.length-1;i>=0;i--){
    var s=S.seances[i]; if(s.type!=='renfo')continue;
    if(blocId&&s.blocId!==blocId)continue;
    var sets=(s.sets||[]).filter(function(x){return x.exoId===exoId});
    if(sets.length)return {date:s.date,sets:sets,semaine:s.semaine};
  }
  return null;
}
function setLabel(e,s){
  if(!e)return s.reps+' × '+nfmt(s.charge);
  if(e.unite==='sec')return s.reps+' s'+(s.charge?' + '+nfmt(s.charge)+' kg':'');
  if(e.unite==='bw')return s.reps+' reps'+(s.charge?' + '+nfmt(s.charge)+' kg':'');
  if(e.unite==='lvl')return s.reps+' reps · niv '+s.charge;
  return s.reps+' × '+nfmt(s.charge)+' kg';
}

function restFor(e){ var v=e&&+e.rest||0; return v>0?v:(+S.prefs.rest||120) }
/* ================= AUDIO ================= */
var AC=null;
function audioInit(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function beep(f,d,g){if(!AC)return;try{
  var o=AC.createOscillator(),v=AC.createGain();o.type='sine';o.frequency.value=f;
  v.gain.setValueAtTime(0,AC.currentTime);v.gain.linearRampToValueAtTime(g||.25,AC.currentTime+.01);
  v.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);
  o.connect(v);v.connect(AC.destination);o.start();o.stop(AC.currentTime+d+.02)}catch(e){}}
function buzz(p){if(navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}
var HAP={tap:[8],sel:[12],ok:[18],warn:[24,40,24],big:[30,50,30]};

function paceStr(kmh){if(!kmh)return '';var t=60/kmh,m=Math.floor(t),s=Math.round((t-m)*60);if(s===60){m++;s=0}return m+"'"+pad(s)}
function isRun(m){return m==='Course extérieur'||m==='Course tapis'}
function ergo(m){return m==='Echo bike'||m==='Rameur'||m==='Ski erg'||m==='Vélo'}
var TGS={allure:'Allure course',ergo:'Puissance ergo',charge:'Charge ou consigne',effort:'Effort seul'};
function blockTarget(modalite,key,ph){
  var I=INT[key]||INT.z2, p=S.prefs, o={main:'',m2:'',fc:'',ok:false};
  if(p.fcmax)o.fc=Math.round(p.fcmax*(I.fc-.03))+' à '+Math.round(p.fcmax*(I.fc+.02))+' bpm';
  var tg=ph&&ph.tg;
  /* une station au sol n'a pas d'allure : on affiche sa consigne ou son intensité */
  if(tg==='charge'){o.main=(ph.ch||'').trim()||'à ta main'; o.ok=true; return o}
  if(tg==='effort'){o.main=I.l; o.ok=true; return o}
  var run=(tg==='allure')||(!tg&&isRun(modalite));
  var erg=(tg==='ergo')||(!tg&&modalite==='Echo bike');
  var rref=(tg==='ergo'||!tg)?(modalite==='Rameur'?R('row500'):(modalite==='Ski erg'?R('ski500'):0)):0,vma=R('vma'),w4=R('w4');
  if(ph&&ph.rpe)o.fc=(o.fc?o.fc+' · ':'')+'RPE '+ph.rpe;
  /* cible relative au split 2000 m (séances type « 2K - 2 s ») */
  if(ph&&ph.so&&(modalite==='Ski erg'||modalite==='Rameur')){var a=ph.so[0],b=ph.so[1];
    if(rref){o.main=(a===b?splitStr(rref+a):splitStr(rref+a)+' à '+splitStr(rref+b))+' /500 m';o.m2=Math.round(c2W(rref+b))+' à '+Math.round(c2W(rref+a))+' W'}
    else if(!a&&!b&&ph.i==='smax'){o.main='Régulier, dernier 500 m à fond';o.m2='le split moyen devient ta référence'}
    else{o.main='2K '+soTxt(a,b)+' /500 m';o.m2='renseigne ton split 2000 m'}
    o.ok=true;return o}
  if(run&&vma){
    var lo=vma*(I.vma-.02),hi=vma*(I.vma+.02);
    o.main=paceStr(hi)+' à '+paceStr(lo)+' /km'; o.m2=nfmt(lo)+' à '+nfmt(hi)+' km/h'; o.ok=true;
    /* sur tapis on règle une vitesse : km/h en premier */
    if(modalite==='Course tapis'){var t0=o.main;o.main=o.m2;o.m2=t0}
  }else if(rref){
    var sf=splitAt(rref,I.w4+.04),ss=splitAt(rref,I.w4-.04);
    o.main=splitStr(sf)+' à '+splitStr(ss)+' /500 m'; o.m2=Math.round(c2W(ss))+' à '+Math.round(c2W(sf))+' W'; o.ok=true;
  }else if(erg&&w4){
    o.main=Math.round(w4*(I.w4-.04))+' à '+Math.round(w4*(I.w4+.04))+' W';
    if(p.rpm4)o.m2=Math.round(p.rpm4*Math.pow(I.w4-.04,1/3))+' à '+Math.round(p.rpm4*Math.pow(I.w4+.04,1/3))+' rpm';
    o.ok=true;
  }
  if(!o.ok){o.main=o.fc||I.l; if(o.main===o.fc)o.fc=''}
  return o;
}
/* ================= OBJECTIFS DATÉS =================
   Repère mesuré (Réglages, test) = point de départ. L'objectif fixe une valeur cible à une date.
   Référence de la semaine = départ + (cible - départ) x semaines écoulées / semaines prévues, plus l'ajustement cumulé.
   Ajustement : après chaque séance saisie avec l'effort réalisé et le RPE, un pas en avance, en maintien ou en retard (4 pas au plus). */
var GK={
  vma:{l:'VMA course',u:'km/h',dir:1,step:.1,gain:{8:.03,12:.045},mod:'course',test:'test VMA ou 5 km'},
  w4:{l:'W4 echo bike',u:'W',dir:1,step:5,gain:{8:.05,12:.07},mod:'Echo bike',test:'Test 4 min max · echo bike'},
  ski500:{l:'Ski erg 2000 m',u:'/500 m',dir:-1,step:1,gain:{8:.02,12:.03},mod:'Ski erg',test:'Test 2000 m · ski erg'},
  row500:{l:'Rameur 2000 m',u:'/500 m',dir:-1,step:1,gain:{8:.02,12:.03},mod:'Rameur',test:'Test 2000 m · rameur'}
};
var GORD=['ski500','row500','w4','vma'],OBJH={};
function gFmt(k,v){if(!v)return '—';if(k==='ski500'||k==='row500')return splitStr(v);if(k==='vma')return nfmt(Math.round(v*10)/10);return String(Math.round(v))}
function gRound(k,v){var st=GK[k].step;return Math.round(v/st)*st}
function refKey(m){return m==='Ski erg'?'ski500':m==='Rameur'?'row500':m==='Echo bike'?'w4':isRun(m)?'vma':null}
function gWeeks(g){return Math.max(1,Math.round((pDate(g.end)-pDate(g.from))/6048e5))}
function gWeek(g){return Math.min(gWeeks(g),Math.max(0,Math.floor((pDate(today())-pDate(g.from))/6048e5)))}
function gPlanned(g){return g.start+(g.target-g.start)*gWeek(g)/gWeeks(g)}
function R(k){var b=+S.prefs[k]||0,g=S.goals&&S.goals[k];if(!b||!g)return b;return gPlanned(g)+(+g.adj||0)}
function gPropose(k,w){var b=+S.prefs[k]||0;if(!b)return 0;var G=GK[k];return gRound(k,b*(1+G.dir*G.gain[w]))}
function gRebase(k){var g=S.goals&&S.goals[k],b=+S.prefs[k]||0;if(!g||!b)return;g.start=b;g.from=today();g.adj=0;
  if(pDate(g.end)<=pDate(addDays(today(),14)))g.end=addDays(today(),28);
  if(GK[k].dir*(g.target-b)<=0)g.target=gRound(k,b*(1+GK[k].dir*GK[k].gain[8]))}
/* cible numérique d'une phase : split (s /500 m), watts ou km/h */
function phNum(mod,ph){var k=refKey(mod),ref=k?R(k):0,I=INT[ph.i]||INT.z2;if(!ref)return 0;
  if(k==='ski500'||k==='row500')return ph.so?ref+(ph.so[0]+ph.so[1])/2:splitAt(ref,I.w4);
  if(k==='w4')return ref*I.w4;return ref*I.vma}
function planEff(mod,ph){var w=0,t=0,rp=0;(ph||[]).forEach(function(p){if(p.k!=='work')return;var v=phNum(mod,p);if(!v)return;t+=v*p.s;w+=p.s;
    var r=p.rpe?(+String(p.rpe).split('-').pop()):({vmax:9,smax:10,vo2:9,seuil:8,z3:6}[p.i]||5);if(r>rp)rp=r});
  return w?{v:t/w,rpe:rp}:null}
function effTxt(k,v){if(!v)return '—';if(k==='ski500'||k==='row500')return splitStr(v)+' /500 m';if(k==='vma')return paceStr(v)+' /km';return Math.round(v)+' W'}
/* ajustement après séance */
function gAdjust(o){var k=refKey(o.modalite),g=k&&S.goals[k];if(!g||!o.eff||!o.plan)return null;
  var pe=planEff(o.modalite,o.plan);if(!pe)return null;var G=GK[k],res='hold',a=o.eff,t=pe.v;
  var ahead=(k==='ski500'||k==='row500')?a-t<=-1:(a-t)/t>=.02,behind=(k==='ski500'||k==='row500')?a-t>=2:(a-t)/t<=-.03;
  if(o.rpe&&o.rpe>=pe.rpe+2){ahead=false;behind=true}
  if(ahead&&(!o.rpe||o.rpe<=pe.rpe))res='ahead';else if(behind)res='behind';
  var d=res==='ahead'?G.dir*G.step:res==='behind'?-G.dir*G.step:0,lim=4*G.step;
  g.adj=Math.max(-lim,Math.min(lim,Math.round(((+g.adj||0)+d)*100)/100));
  (g.log=g.log||[]).push({d:o.date,r:res,v:a,t:Math.round(t*10)/10});if(g.log.length>20)g.log.shift();
  o.efft=Math.round(t*10)/10;o.effr=res;return {k:k,r:res,d:d}}
function gReview(k){var g=S.goals[k],G=GK[k];if(!g)return null;
  if(pDate(today())>=pDate(g.end))return {t:'end',m:'Échéance atteinte : refais le '+G.test+' et saisis le résultat pour fixer le prochain objectif.'};
  var a=(+g.adj||0)*G.dir;
  if(a>=3*G.step-1e-9)return {t:'up',v:gRound(k,g.target+(+g.adj)),m:'En avance de '+Math.round(a/G.step)+' pas : objectif relevable à '+gFmt(k,gRound(k,g.target+(+g.adj)))+'.'};
  if(a<=-3*G.step+1e-9)return {t:'down',v:gRound(k,g.target+(+g.adj)),m:'En retard de '+Math.round(-a/G.step)+' pas : objectif réaliste à '+gFmt(k,gRound(k,g.target+(+g.adj)))+'.'};
  return null}
function missingRef(m){var p=S.prefs;
  if(isRun(m)&&!p.vma)return 'VMA'; if(m==='Echo bike'&&!p.w4)return 'W4';
  if(m==='Rameur'&&!p.row500)return 'Split 2000 m rameur'; if(m==='Ski erg'&&!p.ski500)return 'Split 2000 m ski erg';
  if(!p.fcmax)return 'FC max'; return null}
/* Rameur et ski erg : le split de référence est celui d'un 2000 m (environ 93 % de la puissance 4 min).
   Puissance proportionnelle au cube de la vitesse : split cible = split 2000 m x (0,93 / fraction de W4)^(1/3). */
function soTxt(a,b){if(a===b)return a?(a<0?'− ':'+ ')+Math.abs(a)+' s':'';
  if(a<0&&b<=0)return '− '+Math.abs(b)+' à '+Math.abs(a)+' s';if(a>=0)return '+ '+a+' à '+b+' s';return '± '+Math.max(-a,b)+' s'}
function splitAt(ref,f){return ref*Math.pow(.93/Math.max(.1,f),1/3)}
function splitStr(sec){sec=Math.round(sec);return Math.floor(sec/60)+':'+pad(sec%60)}
function c2W(split){return 2.8/Math.pow(split/500,3)}
function parseSplit(v){v=String(v||'').trim();if(!v)return 0;
  var m=v.match(/^(\d+)\s*[:.,'h]\s*(\d{1,2})$/);if(m){var sc=m[2].length===1?+m[2]*10:+m[2];return (+m[1])*60+Math.min(59,sc)}
  var n=parseFloat(v.replace(',','.'));if(!(n>0))return 0;return n<10?Math.round(n*60):Math.round(n)}
function distSec(mod,dm,key,so){var I=INT[key]||INT.vmax,ref=mod==='Rameur'?R('row500'):(mod==='Ski erg'?R('ski500'):0),vma=R('vma');
  if(ref)return Math.round((so?ref+(so[0]+so[1])/2:splitAt(ref,I.w4))*dm/500);
  if(isRun(mod)&&vma)return Math.round(dm/(vma*I.vma/3.6));
  return Math.round(dm/(isRun(mod)?4:4.2))}

function stSpeed(i){ var v=R('vma'); return v?v*INT[i].vma:0 }
function stSec(s){
  var dm=+s.dm||0;
  if(dm>0&&s.tg==='allure'){ var k=stSpeed(s.i); if(k)return Math.max(5,Math.round(dm/(k/3.6))) }
  return Math.max(5,+s.s||60);
}
function B(l,s,i,mode,desc,tg,ch){var o={l:l,s:Math.max(1,Math.round(s)),i:i,k:INT[i].k,m:mode||'t',d:desc||''};
  if(tg)o.tg=tg; if(ch)o.ch=ch; return o}
/* bloc d'effort relatif au split 2000 m : so = [écart min, écart max] en s /500 m, rpe = RPE visé */
function Bs(l,s,i,so,rpe,mode){var o=B(l,s,i,mode);if(so)o.so=so;if(rpe)o.rpe=rpe;return o}
function soOf(c){return [+c.soa||0,+c.sob||0]}

  return p}

function planZ2(ph){return Math.round(ph.filter(function(p){return Z2KEYS[p.i]}).reduce(function(a,p){return a+p.s},0)/60)}
function planParts(ph){
  if(!ph||!ph.length)return {wu:0,cd:0,core:0};

var T=S.timer;
function tStart(plan){ audioInit(); wakeOn(); msStart();
  T={phases:plan.phases,fmt:plan.fmt,nom:plan.nom,cat:plan.cat,modalite:plan.modalite,lib:plan.lib||null,
     idx:0,pStart:Date.now(),off:0,actual:[],running:true,pausedAt:null,laps:0,lc:-1};
  S.timer=T; save(); go('cardio');
}
function pElapsed(){ if(!T)return 0; var n=T.running?Date.now():(T.pausedAt||Date.now()); return Math.max(0,(n-T.pStart)/1000-T.off) }
function tElapsed(){ if(!T)return 0; return T.actual.reduce(function(a,b){return a+b},0)+pElapsed() }
function tPlanned(){ return T?T.phases.reduce(function(a,p){return a+p.s},0):0 }
function advance(){ if(!T)return;
  T.actual[T.idx]=pElapsed(); T.idx++; T.pStart=Date.now(); T.off=0; T.lc=-1;
  if(T.idx>=T.phases.length){ finish(); return }
  var c=T.phases[T.idx];
  if(c.k==='work'){beep(1180,.36,.32);buzz([220])} else if(c.k==='rec'){beep(600,.3,.28);buzz([90])} else {beep(880,.28,.26);buzz([120])}
  S.timer=T; save(); paint();
}
function finish(){ beep(1320,.5);setTimeout(function(){beep(880,.5)},300);buzz([300,120,300]);
  var d=Math.round(T.actual.reduce(function(a,b){return a+b},0)),m=T.modalite,n=T.nom,c=T.cat,ph=T.phases,lp=T.laps,lb=T.lib;
  var z2=planZ2(ph),pl=ph.reduce(function(a,p){return a+p.s},0),est='';
  /* blocs passés sans chrono réel (séance suivie ailleurs) : la durée prévue est reprise, à ajuster */
  if(pl&&d<pl*.4){est='chrono '+hlong(d)+' pour '+hlong(pl)+' prévus : durée prévue reprise, ajuste si besoin';d=pl}
  T=null;S.timer=null;wakeOff();msStop();CFG.fmt=null;CFG.nom=null;CFG.build=0;save();paint();
  openSheet(cardioForm({modalite:m,duree:d,note:n+(lp?' · '+lp+' tours':''),plan:ph,cat:c,z2:z2,est:est,lib:lb}));
}
function tPause(){if(!T||!T.running)return;T.pausedAt=Date.now();T.running=false;wakeOff();
  try{navigator.mediaSession.playbackState='paused'}catch(e){}S.timer=T;save();paint()}
function tResume(){if(!T||T.running)return;audioInit();T.off+=(Date.now()-T.pausedAt)/1000;T.pausedAt=null;T.running=true;wakeOn();msStart();S.timer=T;save();paint()}
function tStop(){T=null;S.timer=null;wakeOff();msStop();CFG.fmt=null;CFG.nom=null;CFG.build=0;save()}
function tick(){
  if(!T)return;
  var cur=T.phases[T.idx]; if(!cur){finish();return}
  var e=pElapsed();
  msSync(cur,cur.m==='t'?cur.s-e:e,blockTarget(T.modalite,cur.i,cur));
  if(cur.m==='t'){
    var left=cur.s-e;
    if(left<=0){advance();return}
    var sec=Math.ceil(left);
    if(sec<=3&&sec!==T.lc){T.lc=sec;beep(760,.11,.22)}
    paintRun(mmss(left),cur,e);
  }else{
    if(e>=cur.s&&T.lc!==-2){T.lc=-2;beep(760,.14,.2);buzz([60])}
    paintRun(mmss(e),cur,e);
  }
}
function paintRun(txt,cur,e){
  var c=$('#clock'); if(!c)return;
  c.textContent=txt; c.className='clock '+(cur.m==='t'?cur.k:'up');
  var nx=T.phases[T.idx+1];
  $('#next').textContent=(nx?'suivant : '+nx.l:'dernier bloc')+'   |   '+hms(tElapsed())+' / '+hms(tPlanned());
  var bars=document.querySelectorAll('#pbar i');
  for(var i=0;i<bars.length;i++){var b=bars[i].firstChild;if(!b)continue;
    b.style.transform='scaleX('+(i<T.idx?1:(i>T.idx?0:Math.min(1,e/T.phases[i].s))).toFixed(3)+')'}
}

function blocActif(){for(var i=S.blocs.length-1;i>=0;i--)if(S.blocs[i].actif)return S.blocs[i];return null}
function blocSemaine(b){if(!b)return 0;return Math.min(b.semaines,Math.floor(dayAgo(b.debut)/7)+1)}
function blocFini(b){return b&&Math.floor(dayAgo(b.debut)/7)+1>b.semaines}
/* Séries de travail au poids du jour (hors échauffements et séries de rampe très courtes) */
function workSets(l){return (l||[]).filter(function(x){return !x.w&&(+x.reps||0)>0})}
function topSets(l){var w=workSets(l);if(!w.length)return [];
  var mx=Math.max.apply(null,w.map(function(x){return +x.charge||0}));
  var t=w.filter(function(x){return (+x.charge||0)>=mx-.01});
  var rm=Math.max.apply(null,t.map(function(x){return +x.reps||0}));
  return t.filter(function(x){return (+x.reps||0)>=rm*.5})}
/* Fourchette déduite : reps minimales de la première séance à la charge actuelle (série continue, écart < 6 semaines).
   Bas de fourchette = ce que tu tenais en arrivant à ce poids ; haut = bas + 2 (bas + 4 au delà de 12 reps). */
function autoRange(exoId){
  var hist=exoHistory(exoId),cur=null,first=null,pd=null;
  for(var i=hist.length-1;i>=0;i--){var t=topSets(hist[i].sets.filter(function(x){return !x.tq}));if(!t.length)continue;
    var c=+t[0].charge||0;
    if(cur===null)cur=c;else if(Math.abs(c-cur)>.01)break;
    if(pd&&(pDate(pd)-pDate(hist[i].date))/864e5>42)break;
    first=t;pd=hist[i].date}
  if(!first)return null;
  var lo=Math.max(1,Math.min.apply(null,first.map(function(x){return +x.reps||0})));
  return {lo:lo,hi:lo+(lo>=12?4:2)};
}
function rangeOf(e){ if(!e)return null; var lo=+e.rmin||0,hi=+e.rmax||0;
  if(lo>0)return {lo:lo,hi:hi>=lo?hi:lo+2,auto:0};
  var a=autoRange(e.id); if(a)a.auto=1; return a;
}

function tqMode(sets){var c={};workSets(sets).forEach(function(x){var k=x.tq||'';c[k]=(c[k]||0)+1});

function roundInc(v,inc){inc=+inc||2.5;return Math.max(inc,Math.round(v/inc)*inc)}
function tqTag(x){return x&&x.tq?' <span class="tqt">'+TQS[x.tq]+'</span>':''}
/* Plafond machine (cmax) : paliers successifs.
   1 reps jusqu'à 20 à la charge max ; 2 tempo (3 s de descente, 1 s de pause) de bas de fourchette à 15 ;
   3 unilatéral à 55 % de la charge max si possible, sinon rest-pause (total de reps). Stagnation 3 séances : +1 série ou repos réduit. */
function capProg(e,o,t,tq,rg){
  var cm=+e.cmax||0,mx=o.charge,n=o.series,minR=o.minR,maxR=o.maxR,inc=+e.inc||2.5,hist=exoHistory(e.id);
  var bestStd=0;hist.forEach(function(h){h.sets.forEach(function(x){if(!x.w&&!x.tq&&(+x.charge||0)>=cm-.01&&(+x.reps||0)>bestStd)bestStd=+x.reps||0})});
  function toRP(){o.tq='rp';o.next=cm||mx;o.tgt=Math.max(20,bestStd)+4;o.stage=3;o.sw=1}
  o.cap=1;o.cm=cm;
  if(tq===''||tq==='uni'){
    if(n>=2&&minR>=20){ if(tq===''){o.tq='tempo';o.next=cm;o.tgt=rg.lo;o.stage=2;o.sw=1} else toRP(); }
    else{o.tq=tq;o.next=mx;o.tgt=n<2?Math.min(20,Math.max(rg.lo,maxR)):Math.min(20,Math.max(rg.lo,minR+1));o.stage=tq==='uni'?3:1;o.hi=20}
  }else if(tq==='tempo'){
    if(n>=2&&minR>=15){ if(e.uni){o.tq='uni';o.next=roundInc((cm||mx)*.55,inc);o.tgt=rg.lo;o.stage=3;o.sw=1} else toRP(); }
    else{o.tq='tempo';o.next=mx;o.tgt=Math.min(15,Math.max(rg.lo,minR+1));o.stage=2;o.hi=15}
  }else{o.tq='rp';o.next=mx;o.tgt=maxR+1;o.stage=3}
  if(!o.sw){var same=hist.filter(function(h){var w=workSets(h.sets);return w.length&&tqMode(h.sets)===o.tq&&w.some(function(x){return Math.abs((+x.charge||0)-mx)<.01})}).slice(-4);
    if(same.length===4){var m=same.map(function(h){return Math.max.apply(null,workSets(h.sets).map(function(x){return +x.reps||0}))});if(m[3]<=m[0])o.stag=1}}
  return o;
}
function progression(exoId,blocId){
  var l=lastSetsFor(exoId,blocId||null)||lastSetsFor(exoId);
  var e=exo(exoId); if(!l||!e)return null;
  var tq=e.unite==='kg'?tqMode(l.sets):'',lsets=l.sets.filter(function(x){return (x.tq||'')===tq||x.w});
  var t=topSets(lsets); if(!t.length)return null;
  var mx=+t[0].charge||0,reps=t.map(function(x){return +x.reps||0});
  var minR=Math.min.apply(null,reps),maxR=Math.max.apply(null,reps),n=t.length,inc=+e.inc||0;
  var o={date:l.date,charge:mx,series:n,reps:reps,minR:minR,maxR:maxR,unite:e.unite,next:mx,tgt:maxR,monte:false,rg:null,tq:tq};
  if(e.unite!=='kg'){o.tgt=maxR+(e.unite==='sec'?5:1);return o}
  var rg=rangeOf(e)||{lo:minR,hi:minR+2,auto:1};o.rg=rg;
  var cm=+e.cmax||0;
  if(tq==='tempo'||tq==='rp'||(cm>0&&mx>=cm-.01))return capProg(e,o,t,tq,rg);
  o.monte=n>=2&&minR>=rg.hi&&inc>0;
  /* une seule série au poids du jour : la séance précédente au même poids complète le constat */
  if(!o.monte&&n<2&&inc>0&&maxR>=rg.hi){var hp=exoHistory(exoId).filter(function(x){return x.date<l.date}),pv=hp.length?topSets(hp[hp.length-1].sets):[];
    if(pv.length>=2&&Math.abs((+pv[0].charge||0)-mx)<.01&&Math.min.apply(null,pv.map(function(x){return +x.reps||0}))>=rg.hi){o.monte=true;o.both=1}}
  if(o.monte){o.next=Math.round((mx+inc)*100)/100;o.tgt=rg.lo;
    /* la montée ne dépasse jamais la charge max déclarée de la machine */
    if(cm>0&&o.next>cm){o.next=cm;o.capd=1}}
  else if(n<2)o.tgt=Math.min(rg.hi,Math.max(rg.lo,maxR));
  else o.tgt=Math.min(rg.hi,Math.max(rg.lo,minR+1));
  return o;
}
function progTxt(pg,e){

    if(pg.sw&&pg.tq==='uni')return 'Palier unilatéral : <b>'+nfmt(pg.next)+' kg</b> sur un côté, vise <b>'+pg.tgt+' reps</b> par côté. Palier tempo validé le '+d+'.';

    return 'Stack au max (<b>'+cm+' kg</b>), vise <b>'+pg.tgt+' reps</b> par série. Palier reps jusqu\'à 20, puis tempo. Le '+d+' : '+last+'.'+st}
  if(pg.monte&&pg.capd)return 'Monte à <b>'+nfmt(pg.next)+' kg</b>, max de la machine, vise <b>'+pg.tgt+' reps</b> par série. Haut de fourchette atteint le '+d+' : '+last+'.';
  if(pg.monte)return 'Monte à <b>'+nfmt(pg.next)+' kg</b>, vise <b>'+pg.tgt+' reps</b> par série. '+(pg.both?'Haut de fourchette tenu sur les deux dernières séances à '+nfmt(pg.charge)+' kg.':'Haut de fourchette atteint le '+d+' : '+last+' à '+nfmt(pg.charge)+' kg.');
  if(pg.series<2)return 'Reste à <b>'+nfmt(pg.next)+' kg</b>, vise <b>2 séries de '+pg.tgt+' reps</b>. Le '+d+' : une seule série à ce poids ('+last+')'+f+'.';
  if(pg.minR<rg.lo)return 'Reste à <b>'+nfmt(pg.next)+' kg</b>, reviens à <b>'+pg.tgt+' reps</b> par série. Le '+d+' : '+last+', sous la fourchette '+rg.lo+' à '+rg.hi+'.';
  return 'Reste à <b>'+nfmt(pg.next)+' kg</b>, vise <b>'+pg.tgt+' reps</b> par série. Le '+d+' : '+last+f+'.';
}
function suggest(b,item){

  newRenfo([]);

function addSet(exoId,reps,charge,forceW){
  var e=exo(exoId),c0=+charge||0,w=warmGuess(e,exoId,c0);
  /* échauffement proposé puis validé : reste un échauffement sauf si la charge a été montée au niveau du travail */
  if(forceW&&!w){var pg0=progression(exoId,S.cur.blocId||null);w=(!pg0||c0<pg0.next*.9)?1:0}
  var st={id:uid(),exoId:exoId,reps:+reps||0,charge:+charge||0,rpe:null,pr:false,fresh:1};
  var tq0=S.cur.tq&&S.cur.tq[exoId]||'';if(tq0&&!w)st.tq=tq0;
  if(w)st.w=1;
  S.cur.sets.push(st); recalcPR(S.cur);
  S.cur.act=exoId; save();
  var n=S.cur.sets.filter(function(s){return s.exoId===exoId&&!s.w}).length+1;
  restStart(w?Math.min(60,restFor(e)):restFor(e),w?'Échauffement · '+e.nom:'Série '+n+' · '+e.nom);
  if(st.pr){toast('Record personnel');beep(1320,.18);setTimeout(function(){beep(1600,.22)},160);hap('big')}

var CATS=['Course','Musculation','Ergomètres','Hybride','Zone 2'];
function catDefault(m){ if(isRun(m))return 'Course'; if(ergo(m))return 'Ergomètres'; if(/salle|plateau|conditioning|hyrox/i.test(m||''))return 'Hybride'; return 'Zone 2' }
function catOf(s){
  if(s.type==='renfo')return 'Musculation';
  if(s.cat)return s.cat;
  return catDefault(s.modalite);
}
function weekOf(dateISO){
  var m=monday(dateISO||today()), d=new Date(m); d.setDate(d.getDate()+6);
  var fin=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
  var ss=S.seances.filter(function(s){return s.date>=m&&s.date<=fin});
  var main=ss.filter(function(s){return !s.ann});
  var z2=ss.reduce(function(a,s){return a+(+s.z2||0)},0);
  var vol=ss.filter(function(s){return s.type==='renfo'}).reduce(function(a,s){return a+volume(s)},0);
  var dur=ss.reduce(function(a,s){return a+(+s.duree||0)},0);
  return {debut:m,fin:fin,seances:ss,main:main,ann:ss.length-main.length,z2:z2,vol:vol,duree:dur};
}

  d.addEventListener('click',function(e){if(e.target===d)closeSheet()});

  /* glisser vers le bas pour fermer */

  pane.addEventListener('touchstart',function(e){ if(pane.scrollTop>0)return; y0=e.touches[0].clientY;dy=0;pane.style.transition='none' },{passive:true});
  pane.addEventListener('touchmove',function(e){ if(y0===null)return;
    dy=e.touches[0].clientY-y0; if(dy<0){dy=0;return} pane.style.transform='translateY('+dy+'px)' },{passive:true});
  pane.addEventListener('touchend',function(){ if(y0===null)return;

function seanceById(id){for(var i=0;i<S.seances.length;i++)if(S.seances[i].id===id)return S.seances[i];return null}
function recalcPR(s){
  var prev={};
  s.sets.forEach(function(st){
    var e=exo(st.exoId); if(!e||st.w){st.pr=false;return}
    /* records comparés à technique égale (standard, tempo, unilatéral, rest-pause) */
    var key=st.exoId+'|'+(st.tq||'');
    if(prev[key]===undefined){
      var best={e1:0,reps:0,n:0};
      S.seances.forEach(function(o){ if(o.type!=='renfo'||o.id===s.id||o.date>s.date)return;
        (o.sets||[]).forEach(function(x){ if(x.exoId!==st.exoId||x.w||(x.tq||'')!==(st.tq||''))return; best.n++;
          if(e.unite==='kg'){var v=e1rm(+x.charge||0,+x.reps||0); if(v>best.e1)best.e1=v}
          else if((+x.reps||0)>best.reps)best.reps=+x.reps||0 })});
      prev[key]=best;
    }
    var bb=prev[key];
    if(e.unite==='kg'){var v2=e1rm(+st.charge||0,+st.reps||0);
      st.pr=bb.n>0&&(+st.reps||0)>0&&v2>bb.e1+.01; if(v2>bb.e1)bb.e1=v2;}
    else {st.pr=bb.n>0&&(+st.reps||0)>bb.reps; if((+st.reps||0)>bb.reps)bb.reps=+st.reps||0;}
  });
}

/* ================= ÉCRAN VERROUILLÉ (Media Session) ================= */
var MS={el:null,url:null,on:false,last:''};
function silentWavURL(){
  var sr=8000,sec=5,n=sr*sec,buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
  function w(o,t){for(var i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i))}
  w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);
  v.setUint16(20,1,true);v.setUint16(22,1,true);v.setUint32(24,sr,true);
  v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);
  w(36,'data');v.setUint32(40,n*2,true);
  for(var i=0;i<n;i++)v.setInt16(44+i*2,Math.round(2*Math.sin(2*Math.PI*45*i/sr)),true);
  return URL.createObjectURL(new Blob([buf],{type:'audio/wav'}));
}
function msSupported(){return 'mediaSession' in navigator}
function msStart(){
  if(!S.prefs.lock||MS.on||!msSupported())return;
  try{
    if(!MS.el){ MS.url=silentWavURL(); MS.el=document.createElement('audio');
      MS.el.src=MS.url; MS.el.loop=true; MS.el.volume=0.02; MS.el.setAttribute('playsinline','');
      document.body.appendChild(MS.el); }
    var pr=MS.el.play(); if(pr&&pr.catch)pr.catch(function(){});
    MS.on=true;
    navigator.mediaSession.playbackState='playing';
    ['play','pause','stop','nexttrack','previoustrack'].forEach(function(a){
      try{ navigator.mediaSession.setActionHandler(a,function(){
        if(a==='play')tResume(); else if(a==='pause')tPause();
        else if(a==='nexttrack')advance(); else if(a==='stop'){}
      })}catch(e){}
    });
  }catch(e){}
}
function msStop(){
  if(!MS.on)return; MS.on=false;
  try{ MS.el.pause(); navigator.mediaSession.playbackState='none';
    if(navigator.mediaSession.metadata)navigator.mediaSession.metadata=null }catch(e){}
}
function msSync(cur,left,tgt){
  if(!MS.on||!msSupported())return;
  var t=cur.l+' · '+mmss(left);
  if(t===MS.last)return; MS.last=t;
  try{
    navigator.mediaSession.metadata=new MediaMetadata({
      title:t, artist:(tgt&&tgt.main)||'', album:T.nom+' · '+T.modalite,
      artwork:[{src:'icon-192.png',sizes:'192x192',type:'image/png'},
               {src:'icon-512.png',sizes:'512x512',type:'image/png'}]});
    navigator.mediaSession.playbackState=T.running?'playing':'paused';
  }catch(e){}
}

  var sx=function(x){return L+(W-L-R)*(x-x0)/(x1-x0)},sy=function(v){return T+(H-T-B)*(1-(v-mn)/(mx-mn))};

  if(pts.length>1)s+='<path class="ar" d="'+d+'L'+sx(pts[pts.length-1].x).toFixed(1)+' '+(H-B)+'L'+sx(pts[0].x).toFixed(1)+' '+(H-B)+'Z"/><path class="ln" d="'+d+'"/>';
  pts.forEach(function(p,i){var cx=sx(p.x).toFixed(1),cy=sy(p.y).toFixed(1);

    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||'')+'">'+s+'</svg></div>';
}

function prevOf(exoId,date,sid){
  var best=null;S.seances.forEach(function(s){if(s.type!=='renfo'||s.id===sid||s.date>=date)return;
    var sets=(s.sets||[]).filter(function(x){return x.exoId===exoId});if(sets.length&&(!best||s.date>best.date))best={date:s.date,sets:sets}});
  return best;
}
function deltaTag(e,cur,prev){
  if(!prev)return '<span class="delta">nouveau</span>';
  var a=topOf(e,cur).set,b=topOf(e,prev.sets).set;if(!a||!b)return '';
  if(e.unite==='kg'){var d=(+a.charge||0)-(+b.charge||0);
    if(Math.abs(d)>=.01)return '<span class="delta'+(d>0?' up':'')+'">'+(d>0?'+':'−')+nfmt(Math.abs(d))+' kg</span>';
    var r=(+a.reps||0)-(+b.reps||0);return r?'<span class="delta'+(r>0?' up':'')+'">'+(r>0?'+':'−')+Math.abs(r)+' rep</span>':'<span class="delta">=</span>'}
  var r2=(+a.reps||0)-(+b.reps||0);return r2?'<span class="delta'+(r2>0?' up':'')+'">'+(r2>0?'+':'−')+Math.abs(r2)+(e.unite==='sec'?' s':' rep')+'</span>':'<span class="delta">=</span>';
}

/* ================= MODULE TOM HOLLAND =================
   Cindy : AMRAP (5 tractions, 10 pompes, 15 squats), référence publique de Tom Holland 27 tours en 20 min.
   Échelle 1500 : échelons 1 à sommet puis retour à 1 ; à l'échelon k : k tractions, 2k dips, 3k pompes, 4k sit-ups, 5k squats.
   Compteur : un tap par mouvement terminé, temps enregistré à chaque tap. */
var TH={
  cindy:{nom:'Cindy',sous:'AMRAP : 5 tractions, 10 pompes, 15 squats en boucle',vers:[['rx','RX'],['band','Élastique'],['row','Rowing']],
    moves:function(v){return [{n:v==='row'?'rowing haltère':(v==='band'?'tractions élastique':'tractions'),r:5,ic:v==='row'?'row':'pullup'},{n:'pompes',r:10,ic:'pushup'},{n:'squats',r:15,ic:'airsquat'}]}},
  ladder:{nom:'Échelle 1500',sous:'Échelons 1 à 10 puis retour à 1 : tractions, dips, pompes, sit-ups, squats',vers:[['rx','RX'],['band','Élastique']],
    moves:function(v){return [{n:v==='band'?'tractions élastique':'tractions',m:1,ic:'pullup'},{n:'dips',m:2,ic:'dips'},{n:'pompes',m:3,ic:'pushup'},{n:'sit-ups',m:4,ic:'situp'},{n:'squats',m:5,ic:'airsquat'}]}}
};
TH.home={nom:'Routine maison',sous:'Barre de traction seule : tractions, relevés de jambes, pompes, repos, puis squats pour finir',
  vers:[['rx','RX'],['band','Élastique'],['knee','Genoux pliés']],
  moves:function(v,p){p=p||thP();return [{n:v==='band'?'tractions élastique':'tractions',r:p.hpu,ic:'pullup'},{n:v==='knee'?'relevés de genoux':'relevés de jambes',r:p.hlr,ic:'legraise'},{n:'pompes',r:p.hpp,ic:'pushup'}]}};

  vers:[['rx','RX'],['incl','Pompes inclinées']],
  moves:function(v,p){p=p||thP();return [{n:'KB swings',r:p.wsw,ic:'kbswing'},{n:v==='incl'?'pompes inclinées':'pompes',r:p.wpp,ic:'pushup'}]}};
/* formats en séquence figée (séries + repos) : routine maison et routine réveil */
function isSq(k){return k==='home'||k==='wake'}
function sqCfg(k,p){return k==='wake'?[p.wset,p.wsw,p.wpp,p.wkg].join('-'):homeCfg(p)}
function sqTot(k,cfg){if(k!=='wake')return homeTot(cfg);var a=String(cfg).split('-').map(Number);return a[0]*(a[1]+a[2])}
function sqVer(k){return k==='wake'?thP().wver:thP().hver}
function wakeSeq(p,v){var mv=TH.wake.moves(v,p),q=[];
  for(var x=1;x<=p.wset;x++){mv.forEach(function(m,j){q.push({n:m.n,reps:m.r,ic:m.ic,j:j,rd:x-1,set:x,end:j===mv.length-1})});
    if(x<p.wset&&p.wrest>0)q.push({rest:Math.round(p.wrest),n:'repos',reps:0,ic:'stopwatch',j:mv.length,rd:x-1,set:x})}
  return q}
function homeCfg(p){return [p.hset,p.hpu,p.hlr,p.hpp,p.hsq].join('-')}
function homeTot(cfg){var a=String(cfg).split('-').map(Number);return a[0]*(a[1]+a[2]+a[3])+a[4]}
/* séquence : séries de 3 mouvements séparées par un repos minuté, puis squats découpés par 25 pour compter sans se perdre */
function homeSeq(p,v){var mv=TH.home.moves(v,p),q=[];
  for(var x=1;x<=p.hset;x++){mv.forEach(function(m,j){q.push({n:m.n,reps:m.r,ic:m.ic,j:j,rd:x-1,set:x,end:j===mv.length-1})});
    if(x<p.hset&&p.hrest>0)q.push({rest:Math.round(p.hrest*60),n:'repos',reps:0,ic:'stopwatch',j:3,rd:x-1,set:x})}
  if(p.hsq>0){var ch=p.hsq>=40?25:p.hsq,left=p.hsq,c=0,nb=Math.ceil(p.hsq/ch),jj=0;
    while(left>0){var r=Math.min(ch,left);c+=r;left-=r;q.push({n:'squats',reps:r,ic:'airsquat',j:jj++,nb:nb,rd:p.hset,set:0,fin:1,sq:c+' / '+p.hsq,end:left===0})}}

function parOf(k,w){return k==='cindy'?w.min:isSq(k)?w.cfg:w.top}

function thVer(k){var p=thP();return k==='cindy'?p.cver:isSq(k)?sqVer(k):p.lver}
var THK='wake',THFROM='cardio',HOLLAND=27,_wt=0;
function thP(){return S.prefs.th}

  if(w.k==='cindy'){var mv=TH.cindy.moves(w.ver),j=i%3;return {rd:Math.floor(i/3),j:j,reps:mv[j].r,n:mv[j].n,ic:mv[j].ic,per:3}}
  var ml=TH.ladder.moves(w.ver),R=2*w.top-1,rd=Math.floor(i/5),jj=i%5;if(rd>=R)return null;
  var k=rd<w.top?rd+1:2*w.top-1-rd;return {rd:rd,j:jj,k:k,reps:k*ml[jj].m,n:ml[jj].n,ic:ml[jj].ic,per:5};

function wSteps(w){return w.k==='cindy'?Infinity:isSq(w.k)?(w.seq||[]).length:5*(2*w.top-1)}

  S.wod={k:k,ver:thVer(k),min:p.cmin,top:p.ltop,goal:k==='cindy'?wodGoal():0,st:'cd',cdEnd:Date.now()+10000,t0:0,off:0,pz:0,taps:[],lc:-1,m1:0,endAt:0};
  if(isSq(k)){S.wod.cfg=sqCfg(k,p);S.wod.seq=k==='wake'?wakeSeq(p,p.wver):homeSeq(p,p.hver);S.wod.rp={}}

function wodTick(){var w=S.wod;if(!w||w.st==='end')return;var now=Date.now();

  if(w.pz)return;

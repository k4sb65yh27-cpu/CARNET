:root{
  --bg:#000; --el1:#14191B; --el2:#1F2629; --el3:#2B3438;
  --sep:rgba(84,84,88,.6); --sep2:rgba(84,84,88,.34);
  --tx:#FFFFFF; --tx2:rgba(235,235,245,.7); --tx3:rgba(235,235,245,.55);
  --ac:#8CC2D1; --ac2:#5E95A5; --acs:rgba(76,120,134,.3); --act:#08181D; --acf:#4C7886; --acft:#FFFFFF;
  --red:#FF453A; --grn:#30D158; --yel:#FFD60A; --org:#FF9F0A;
  --glass:rgba(22,22,24,.74); --glass2:rgba(30,30,32,.9);
  --r:12px; --r2:16px; --r3:22px;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,monospace; --num:var(--sans); --disp:"OSO",var(--sans);
  --nb:44px; --tb:66px;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --ez:cubic-bezier(.32,.72,0,1); --ez-out:cubic-bezier(.23,1,.32,1);
  --r4:28px;
  --work:#FF6B4A; --rec:#8CC2D1; --z2:#30D158; --seuil:#FFD60A; --pr:#E2BB6C;
  --c-mus:#3987e5; --c-run:#d95926; --c-erg:#9085e9; --c-hyb:#c98500; --c-z2:#199e70;
  --shadow:0 10px 34px rgba(0,0,0,.45);
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#F1F4F5; --el1:#FFFFFF; --el2:#EDF1F2; --el3:#E0E6E8;
  --sep:rgba(60,60,67,.29); --sep2:rgba(60,60,67,.14);
  --tx:#000000; --tx2:rgba(60,60,67,.86); --tx3:rgba(60,60,67,.76);
  --ac:#3F6B79; --ac2:#2F5461; --acs:rgba(71,120,135,.13); --act:#FFFFFF; --acf:#477887; --acft:#FFFFFF;
  --red:#D70015; --grn:#248A3D;
  --glass:rgba(249,249,251,.8); --glass2:rgba(255,255,255,.94);
  --work:#D6421F; --rec:#3F6B79; --z2:#248A3D; --seuil:#B08600; --pr:#D3A24A;
  --c-mus:#2a78d6; --c-run:#eb6834; --c-erg:#4a3aa7; --c-hyb:#eda100; --c-z2:#1baf7a;
  --shadow:0 10px 34px rgba(0,0,0,.14);
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%;-webkit-text-size-adjust:100%;touch-action:manipulation;overflow-x:clip}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);
  font-family:var(--sans);font-size:17px;line-height:1.3;letter-spacing:-.012em;
  -webkit-font-smoothing:antialiased;overscroll-behavior-y:none;font-variant-numeric:tabular-nums;overflow-x:clip;
  padding-bottom:calc(var(--tb) + var(--sb) + 16px);-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text}
body.cta-on{padding-bottom:calc(var(--tb) + var(--sb) + 96px)}
body.run{padding-bottom:0;overflow:hidden}
body.lock{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.022em;text-wrap:balance}
.sug,.foot,.enote,.capq,.empty{text-wrap:pretty}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.013em}

/* ---------- NAV BAR ---------- */
.top{position:fixed;top:0;left:0;right:0;z-index:60;height:calc(var(--nb) + var(--st));
  padding:var(--st) 16px 0;display:flex;align-items:center;justify-content:center;transition:background .25s ease}
.top:after{content:'';position:absolute;left:0;right:0;bottom:0;height:.5px;background:var(--sep);opacity:0;transition:opacity .2s}
body.sc .top{background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px)}
body.sc .top:after{opacity:1}
.top h1{font-size:17px;font-weight:620;opacity:0;transform:translateY(6px);transition:opacity .2s,transform .25s var(--ez);
  max-width:56%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
body.sc .top h1{opacity:1;transform:none}
.top .bk{position:absolute;left:6px;bottom:0;height:var(--nb);display:flex;align-items:center;gap:2px;border:0;background:none;
  color:var(--ac);font-size:17px;padding:0 10px 0 4px}
.top .bk svg{width:13px;height:21px;stroke:currentColor;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.top .sub{position:absolute;right:16px;bottom:13px;font-size:13px;color:var(--tx3);font-weight:520;opacity:0;transition:opacity .2s}
body.sc .top .sub{opacity:1}
body.run .top{display:none}

.wrap{padding:calc(var(--nb) + var(--st) + 2px) 16px 28px;max-width:720px;margin:0 auto}
.lt{font-family:var(--disp);font-size:33px;line-height:1.02;font-weight:900;letter-spacing:-.01em;text-transform:uppercase;margin:4px 2px 18px;
  transform-origin:left top;transition:opacity .2s,transform .25s var(--ez)}
body.sc .lt{opacity:0;transform:scale(.88) translateY(-6px)}
.lt .dt{display:block;font-family:var(--sans);text-transform:none;font-size:15px;font-weight:590;letter-spacing:-.01em;color:var(--tx2);margin-bottom:2px}
.lt .dt::first-letter{text-transform:uppercase}

/* ---------- SURFACES ---------- */
.card{background:var(--el1);border-radius:var(--r2);padding:16px;margin-bottom:14px}
:root[data-theme="light"] .card{box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card.flat{padding:0;overflow:hidden}
.card h2{font-size:19px;letter-spacing:-.022em}
.ch{display:flex;align-items:baseline;gap:8px;margin-bottom:12px}
.ch h2{flex:1;min-width:0}
.ch .more{font-size:15px;color:var(--ac);border:0;background:none;padding:0}
.row{display:flex;gap:10px;align-items:center}
.row.w{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{font-size:13px;color:var(--tx2);margin-bottom:6px;display:block;font-weight:500;letter-spacing:-.005em}
.muted{color:var(--tx2)} .dim{color:var(--tx3)}
.s11{font-size:12px}.s12{font-size:13px}.s13{font-size:15px}
.sec{font-size:15px;color:var(--tx2);margin:24px 16px 7px;font-weight:600;letter-spacing:-.01em}
.sec::first-letter{text-transform:uppercase}
.sec:first-child{margin-top:4px}
.foot{font-size:13px;color:var(--tx3);margin:-6px 16px 16px;line-height:1.38}
.empty{text-align:center;color:var(--tx3);font-size:15px;padding:30px 12px;line-height:1.5}
.empty .ico{width:64px;height:64px;margin:0 auto 10px;display:block;--fg:var(--tx3);--ic:var(--tx3)}
.empty b{display:block;color:var(--tx2);font-size:17px;font-weight:600;margin-bottom:4px}

/* ---------- BUTTONS ---------- */
button.b{background:var(--el2);border:0;border-radius:999px;padding:13px 18px;
  font-weight:590;font-size:17px;text-align:center;letter-spacing:-.012em;
  transition:transform .16s var(--ez),opacity .16s,background .16s}
:root[data-theme="light"] button.b:not(.pri):not(.gh):not(.dgr):not(.tint):not(.xs):not(.zgo):not(.zlk){background:var(--el3)}
button.b:active{transform:scale(.96);opacity:.85}
button.b.pri{background:var(--acf);color:var(--acft);font-weight:680;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
button.b.gh{background:transparent;color:var(--ac);font-weight:560}
button.b.dgr{color:var(--red);background:transparent;font-weight:560}
button.b.tint{background:var(--acs);color:var(--ac);font-weight:620}
button.b.sm{padding:9px 14px;font-size:15px;border-radius:999px}
button.b.xs{padding:5px 11px;font-size:13px;border-radius:999px;background:var(--el2);color:var(--tx2);font-weight:560}
:root[data-theme="light"] button.b.xs{background:var(--el3)}
button.b.xs.tint,:root[data-theme="light"] button.b.xs.tint{background:var(--acs);color:var(--ac)}
button.b.full{width:100%}
button.b.big{padding:16px;font-size:17px;border-radius:999px}
button.b:disabled{opacity:.35}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2.5px solid var(--ac);outline-offset:2px}
.ib{width:34px;height:34px;border-radius:50%;border:0;background:var(--el2);color:var(--tx2);display:inline-grid;place-items:center;flex:none;padding:0}
:root[data-theme="light"] .ib{background:var(--el3)}
.ib svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.ib:active{opacity:.6}
.ib,button.b.xs,.set button.i,.edr button.n,.ch .more{position:relative}
.ib::before,button.b.xs::before,.set button.i::before,.edr button.n::before,.ch .more::before{content:"";position:absolute;inset:-8px}
button.b.xs::before{inset:-8px -2px}
.btns{display:flex;gap:10px}
.btns>*{flex:1}

input,select,textarea{background:var(--el2);border:0;border-radius:10px;padding:12px;width:100%;
  font-size:17px;-webkit-appearance:none;appearance:none;outline:none}
:root[data-theme="light"] input,:root[data-theme="light"] select,:root[data-theme="light"] textarea{background:var(--el3)}
select{background-image:linear-gradient(45deg,transparent 50%,var(--tx3) 50%),linear-gradient(135deg,var(--tx3) 50%,transparent 50%);
  background-position:calc(100% - 16px) 50%,calc(100% - 11px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
input[type=number]{-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
input[type=date]{min-height:44px}
textarea{resize:none;line-height:1.35}
input::placeholder,textarea::placeholder{color:var(--tx3)}

/* ---------- SEGMENTED ---------- */
.seg{display:flex;background:var(--el2);border-radius:999px;padding:3px;margin-bottom:16px;position:relative}
:root[data-theme="light"] .seg{background:rgba(118,118,128,.12)}
.seg button{flex:1;border:0;background:transparent;color:var(--tx);font-size:14px;font-weight:560;
  padding:7px 4px;min-height:40px;border-radius:999px;transition:background .2s var(--ez),box-shadow .2s}
.seg button[aria-pressed="true"]{background:var(--el3);box-shadow:0 2px 6px rgba(0,0,0,.25);font-weight:640}
:root[data-theme="light"] .seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}

/* ---------- TAB BAR ---------- */
.nav{position:fixed;left:12px;right:12px;bottom:max(10px,calc(var(--sb) - 6px));z-index:60;height:60px;border-radius:30px;padding:0 4px;background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);display:flex;
  box-shadow:0 8px 28px rgba(0,0,0,.28),inset 0 0 0 .5px var(--sep);clip-path:inset(0 0 0 0 round 30px);
  transition:clip-path .42s var(--ez),transform .42s var(--ez)}
body.navmin .nav{clip-path:inset(0 calc(100% - 60px) 0 0 round 30px);transform:translateX(2px)}
.nav button{transition:opacity .22s var(--ez-out),transform .42s var(--ez),color .18s}
body.navmin .nav button:not([aria-current="true"]){opacity:0;pointer-events:none;visibility:hidden;transition:opacity .22s var(--ez-out),visibility 0s .22s}
body.navmin .nav button[aria-current="true"]{transform:translateX(calc(-1 * var(--cx,0px)))}
body.navmin .nav button span.lb{opacity:0}
.nav button span.lb{transition:opacity .2s}
body.run .nav{display:none}
.nav button{flex:1;background:none;border:0;color:var(--tx3);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:600;position:relative;border-radius:26px;margin:4px 0}
:root[data-theme="light"] .nav button{color:rgba(60,60,67,.78)}
.nav button svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .22s var(--ez)}
.nav button[aria-current="true"]{color:var(--ac);background:var(--acs)}
.nav button[aria-current="true"] svg{stroke-width:2;fill:currentColor;fill-opacity:.18}
.nav button:active svg{transform:scale(.86)}
.nav .dotlive{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--red);top:8px;left:calc(50% + 10px)}

/* ---------- PICTOGRAMMES ---------- */
.ico{width:100%;height:100%;fill:none;stroke-linecap:round;stroke-linejoin:round;--fg:var(--tx);--ic:var(--ac);display:block}
.ico .b path{stroke:var(--fg);stroke-width:3.1}
.ico .f path{opacity:.36}
.ico .hd{fill:var(--fg)}
.ico .q{stroke:var(--ic);stroke-width:2.6}
.ico .qf{fill:var(--ic)}
.ico .qf2{fill:var(--ic);fill-opacity:.9}
.ico .qe{stroke:var(--ic);stroke-width:2;opacity:.78}
.ico .qd{stroke:var(--ic);stroke-width:2;stroke-dasharray:2.5 3;opacity:.82}
.ico .k{stroke:var(--fg);stroke-width:2.2;opacity:.38}
.it{width:44px;height:44px;border-radius:12px;flex:none;padding:5px;position:relative;display:inline-block;vertical-align:middle;
  background:color-mix(in srgb,var(--c,var(--ac)) 15%,transparent);--ic:var(--c,var(--ac))}
.it .ico{--ic:var(--c,var(--ac))}
.ico .cb{stroke-width:1.3;opacity:.85}
.it.sm{width:34px;height:34px;border-radius:9px;padding:3px}
.it.lg{width:64px;height:64px;border-radius:16px;padding:7px}
.it.xl{width:88px;height:88px;border-radius:22px;padding:9px}
.c-mus{--c:var(--c-mus)}.c-run{--c:var(--c-run)}.c-erg{--c:var(--c-erg)}.c-hyb{--c:var(--c-hyb)}.c-z2{--c:var(--c-z2)}
.c-ac{--c:var(--ac)}
.istrip{display:flex;gap:4px;margin-top:8px}
.istrip .it{width:30px;height:30px;border-radius:8px;padding:2px}
.istrip .more{font-size:12px;color:var(--tx3);align-self:center;margin-left:2px}

/* ---------- LISTES iOS ---------- */
.list{background:var(--el1);border-radius:var(--r2);overflow:hidden;margin-bottom:14px}
:root[data-theme="light"] .list{box-shadow:0 1px 2px rgba(0,0,0,.04)}
.li{display:flex;align-items:center;gap:12px;padding:11px 16px;min-height:52px;position:relative;cursor:pointer;transition:background .12s}
.li.nc{cursor:default}
.li:after{content:'';position:absolute;left:var(--ind,16px);right:0;bottom:0;height:.5px;background:var(--sep2)}
.li:last-child:after{display:none}
.li.hasic{--ind:72px}
.li.hasic.smic{--ind:62px}
.li:not(.nc):active{background:var(--el2)}
:root[data-theme="light"] .li:not(.nc):active{background:var(--el3)}
.li .t{font-size:17px;line-height:1.25}
.li .t.sb{font-weight:590}
.li .m{font-size:13px;color:var(--tx2);margin-top:2px;line-height:1.3}
.li.ses .m{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .r{font-size:15px;color:var(--tx2);text-align:right;flex:none}
.li .r .num{color:var(--tx2)}
.li .dr{font-size:13px;color:var(--tx3);text-align:right;flex:none;line-height:1.25}
.li .dr b{display:block;font-weight:600;color:var(--tx2);font-size:15px}
.li.ann{opacity:.62}
.li input{background:transparent;text-align:right;padding:6px 0;width:96px;flex:none;font-family:var(--num);font-size:17px;color:var(--tx2)}
.li input:focus{color:var(--ac)}
:root[data-theme="light"] .li input,:root[data-theme="light"] .sheet .li input{background:transparent}
.li select{background-color:transparent;text-align:right;color:var(--tx2)}
.li .u{font-size:15px;color:var(--tx3);flex:none;min-width:34px}
.chev{width:8px;height:13px;flex:none;opacity:.32;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.li.red .t{color:var(--red)} .li.acc .t{color:var(--ac)}
.li.ctr{justify-content:center}
.dot{width:9px;height:9px;border-radius:50%;flex:none;background:var(--c,var(--ac))}

/* switch iOS */
.sw{width:51px;height:31px;border-radius:16px;background:rgba(120,120,128,.32);border:0;position:relative;flex:none;transition:background .25s var(--ez);padding:0}
.sw:after{content:'';position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;
  box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .28s var(--ez)}
.sw[aria-checked="true"]{background:var(--grn)}
.sw[aria-checked="true"]:after{transform:translateX(20px)}

/* ---------- BILAN ---------- */
.weeknav{display:flex;align-items:center;gap:8px;margin:-6px 0 14px}
.weeknav .wl{flex:1;text-align:center;font-size:15px;font-weight:590}
.weeknav .wl small{display:block;font-size:12px;color:var(--tx3);font-weight:500;margin-top:1px}
.hero{display:flex;align-items:center;gap:18px}
.ring{width:108px;height:108px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg);display:block}
.ring .v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .v b{font-family:var(--disp);font-weight:800!important;font-size:28px;font-weight:680;letter-spacing:-.023em;line-height:1}
.ring .v i{font-size:12px;font-style:normal;color:var(--tx3);margin-top:3px;font-weight:560}
.ring circle{transition:stroke-dashoffset .9s var(--ez)}
.pillars{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px}
.pil{text-align:center;font-size:12px;color:var(--tx3);font-weight:560}
.pil .it{display:block;margin:0 auto 5px;width:40px;height:40px;opacity:.38;filter:grayscale(1);transition:opacity .3s var(--ez),filter .3s var(--ez)}
.pil.on{color:var(--tx2)}
.pil.on .it{opacity:1;filter:none}
.pil .n{font-family:var(--num);color:var(--tx);font-size:13px;display:block;margin-top:1px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.tile{background:var(--el1);border-radius:var(--r2);padding:13px 14px}
:root[data-theme="light"] .tile{box-shadow:0 1px 2px rgba(0,0,0,.04)}
.tile .k{font-size:13px;color:var(--tx2);font-weight:560;display:flex;align-items:center;gap:6px}
.tile .k .dot{width:7px;height:7px}
.tile .v{font-family:var(--disp);font-size:26px;font-weight:660;letter-spacing:-.02em;margin-top:6px;line-height:1.05}
.tile .u{font-size:13px;color:var(--tx3);font-family:var(--sans);font-weight:520;margin-left:3px;letter-spacing:0}
.tile .s{font-size:12px;color:var(--tx3);margin-top:3px}
.tile .v.lg{font-size:20px;letter-spacing:-.035em}
.bar{height:8px;border-radius:5px;background:var(--el3);overflow:hidden;margin-top:10px}
.bar b{display:block;height:100%;border-radius:5px;background:var(--c-z2);transition:width .9s var(--ez)}
.prog{height:4px;border-radius:2px;background:var(--el3);overflow:hidden}
.prog b{display:block;height:100%;background:var(--ac);border-radius:2px;transition:width .5s var(--ez)}

/* ---------- GRAPHIQUES ---------- */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .gl{stroke:var(--sep2);stroke-width:1}
.chart .ax{fill:var(--tx3);font-size:11px;font-family:var(--sans);letter-spacing:0}
.chart .axr{text-anchor:end}
.chart .axm{text-anchor:middle}
.chart .bk{transition:opacity .2s}
.chart.has-sel .bk{opacity:.4}
.chart.has-sel .bk.sel{opacity:1}
.chart .hit{fill:transparent;cursor:pointer}
.chart .goal{stroke:var(--tx2);stroke-width:1.2;stroke-dasharray:4 4}
.chart .goalt{fill:var(--tx2);font-size:11px;text-anchor:end}
.chart .ln{fill:none;stroke:var(--c,var(--ac));stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--c,var(--ac));opacity:.1}
.chart .pt{fill:var(--el1);stroke:var(--c,var(--ac));stroke-width:2}
.chart .pt.pr{fill:var(--c,var(--ac))}
.cinfo{display:flex;align-items:baseline;gap:8px;min-height:40px;margin:-2px 0 8px}
.cinfo .big{font-family:var(--disp);font-size:24px;font-weight:660;letter-spacing:-.018em}
.cinfo .u{font-size:13px;color:var(--tx3);font-weight:520}
.cinfo .sm{font-size:13px;color:var(--tx2);margin-left:auto;text-align:right;line-height:1.25}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--tx2)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:3px;background:var(--c)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--el3);display:block}
.heat i.l1{background:color-mix(in srgb,var(--ac) 30%,var(--el3))}
.heat i.l2{background:color-mix(in srgb,var(--ac) 55%,var(--el3))}
.heat i.l3{background:color-mix(in srgb,var(--ac) 78%,var(--el3))}
.heat i.l4{background:var(--ac)}
.heat i.fut{background:transparent}
.heat i.td{box-shadow:0 0 0 1.5px var(--tx2)}
.heatm{display:grid;grid-auto-flow:column;gap:3px;font-size:11px;color:var(--tx3);margin-bottom:4px}
.heatl{display:flex;align-items:center;gap:3px;justify-content:flex-end;font-size:12px;color:var(--tx3);margin-top:8px}
.heatl i{width:11px;height:11px;border-radius:3px;display:inline-block}
.tl{display:flex;gap:2px;height:8px;border-radius:4px;overflow:hidden;margin-top:9px}
.tl i{display:block;height:100%;min-width:2px;border-radius:1.5px}
.tl.lg{height:12px;border-radius:6px}
.k-rec{background:var(--rec)}.k-z2{background:var(--z2)}.k-seuil{background:var(--seuil)}.k-work{background:var(--work)}
.tl.lg i{border-radius:2px}

/* ---------- TAGS ---------- */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:650;padding:3px 9px;border-radius:999px;
  background:var(--el2);color:var(--tx2);white-space:nowrap}
:root[data-theme="light"] .tag{background:var(--el3)}
.tag.ac{background:var(--acs);color:var(--ac)}
.tag.cat{background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--tx)}
.tag.cat:before{content:'';width:7px;height:7px;border-radius:50%;background:var(--c)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;font-weight:720;padding:3px 7px;border-radius:6px;background:var(--pr);color:#231D00}
.delta{font-family:var(--num);font-size:12px;font-weight:600;padding:2px 6px;border-radius:6px;background:var(--el2);color:var(--tx2)}
:root[data-theme="light"] .delta{background:var(--el3)}
.delta.up{background:color-mix(in srgb,var(--grn) 18%,transparent);color:var(--tx)}
.setc{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.setc span{font-family:var(--num);font-size:13px;padding:5px 10px;border-radius:999px;background:var(--el2);color:var(--tx);letter-spacing:-.009em}
:root[data-theme="light"] .setc span{background:var(--el3)}
.setc span.pr{background:color-mix(in srgb,var(--pr) 26%,transparent)}
.setc span.wu{color:var(--tx3)}

/* ---------- RENFO ---------- */
.live{background:var(--el1);border-radius:var(--r2);padding:14px 16px;margin-bottom:14px}
.live .clk{font-family:var(--disp);font-size:34px;font-weight:660;letter-spacing:-.023em;line-height:1}
.live .st3{display:flex;gap:18px;margin:12px 0 10px}
.live .st3 div{font-size:12px;color:var(--tx3);font-weight:560}
.live .st3 b{display:block;font-family:var(--num);font-size:17px;color:var(--tx);font-weight:640;letter-spacing:-.013em;margin-top:2px}
.exo{border-radius:var(--r2);margin-bottom:10px;background:var(--el1);overflow:hidden;transition:box-shadow .25s var(--ez)}
.exo.act{box-shadow:0 0 0 2px var(--ac)}
.exo.done:not(.act) .it{opacity:.6}
.exo>header{padding:12px 12px 12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.exo>header:active{background:var(--el2)}
.exo>header .n{font-size:17px;font-weight:600;line-height:1.2}
.exo>header .sub{font-size:13px;color:var(--tx2);margin-top:3px}
.exo>header .sub b{color:var(--ac);font-weight:620}
.tick{min-width:26px;height:26px;border-radius:13px;background:var(--el3);flex:none;display:grid;place-items:center;padding:0 7px;
  font-size:13px;font-weight:660;color:var(--tx3);font-family:var(--num);transition:background-color .3s var(--ez),color .3s var(--ez)}
.tick.on{background:var(--ac);color:var(--act)}
.sets{padding:0 16px}
.set{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:.5px solid var(--sep2);font-size:17px}
.set .i{width:18px;color:var(--tx3);font-size:13px;font-family:var(--num)}
.set button.i{width:26px;height:26px;margin:-4px 0 -4px -4px;padding:0;border:0;background:none;border-radius:8px;color:var(--tx3);font-size:13px;font-family:var(--num);flex:none}
.set button.i.w,.edr button.n.w{color:var(--ac);font-weight:700;background:var(--acs)}
.set.wu .v{color:var(--tx3)}
.edr button.n{width:26px;height:30px;padding:0;border:0;background:none;border-radius:8px;color:var(--tx3);font-size:13px;font-family:var(--num);flex:none}
.hint .hw{opacity:1}
.wuh{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);margin:0 0 10px;padding:7px 8px 7px 11px;border-radius:10px;background:var(--el2)}
:root[data-theme="light"] .wuh{background:var(--el3)}
.wuh b{color:var(--tx);font-family:var(--num);font-weight:600;letter-spacing:-.009em}
.li input.rg{width:40px;text-align:center}
.set .v{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.013em}
.set.new{animation:pop .42s var(--ez)}
@keyframes pop{0%{opacity:0;transform:translateY(-10px) scale(.97)}100%{opacity:1;transform:none}}
.ent{padding:12px 16px 16px;border-top:.5px solid var(--sep2)}
.sug{display:flex;align-items:center;gap:8px;background:var(--acs);border-radius:10px;padding:9px 11px;margin-bottom:10px;font-size:13px;color:var(--tx);line-height:1.3}
.sug svg{width:16px;height:16px;flex:none;stroke:var(--ac);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.sug b{color:var(--ac);font-weight:680}
.hint{font-size:12px;color:var(--tx3);margin:0 0 10px;font-family:var(--num);letter-spacing:-.009em}
.stp{display:flex;align-items:stretch;background:var(--el2);border-radius:18px;overflow:hidden;flex:1;min-width:0}
:root[data-theme="light"] .stp{background:var(--el3)}
.stp button{width:46px;flex:none;background:transparent;border:0;font-size:24px;font-weight:300;color:var(--ac);transition:background .12s;padding:0}
.stp button:active{background:var(--el3)}
.stp .f{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0 6px;min-width:0}
.stp input{border:0;background:none;text-align:center;font-family:var(--num);font-size:24px;font-weight:650;
  padding:0;height:30px;border-radius:0;letter-spacing:-.02em}
.stp .u{font-size:12px;color:var(--tx3);font-weight:560}
.stp.sm button{width:38px;font-size:20px}
.stp.sm input{font-size:17px;height:24px}
.stp.sm .f{padding:6px 0}
.mcard{display:flex;gap:12px;align-items:center;padding:14px 16px;position:relative;cursor:pointer}
.mcard:after{content:'';position:absolute;left:16px;right:0;bottom:0;height:.5px;background:var(--sep2)}
.mcard:last-child:after{display:none}
.mcard:active{background:var(--el2)}

/* ---------- BARRE REPOS ---------- */
.abar{position:fixed;left:8px;right:8px;bottom:calc(var(--tb) + var(--sb) + 8px);z-index:59;
  background:var(--glass2);-webkit-backdrop-filter:saturate(180%) blur(24px);backdrop-filter:saturate(180%) blur(24px);
  border-radius:20px;padding:10px 12px;display:flex;align-items:center;gap:10px;overflow:hidden;
  box-shadow:var(--shadow);animation:slideup .4s var(--ez)}
@keyframes slideup{from{transform:translateY(130%)}to{transform:none}}
.abar .rg{width:44px;height:44px;flex:none;position:relative}
.abar .rg svg{transform:rotate(-90deg);display:block}
.abar .rg circle{transition:stroke-dashoffset .25s linear}
.abar .t{font-family:var(--disp);font-size:26px;font-weight:660;color:var(--tx);font-variant-numeric:tabular-nums;letter-spacing:-.023em;min-width:72px}
.abar.end .t{color:var(--ac)}
.abar .nx{font-size:12px;line-height:1.25;color:var(--tx3);min-width:0;overflow:hidden;font-weight:560}
.abar .nx b{display:block;color:var(--tx);font-size:13px;font-weight:560;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:none;letter-spacing:-.01em}
.abar .b.xs{padding:7px 9px}
.abar .nx b{font-size:14px}

/* ---------- CTA ---------- */
.cta{position:fixed;left:0;right:0;bottom:calc(var(--tb) + var(--sb));z-index:58;padding:10px 16px 12px;
  background:linear-gradient(to top,var(--bg) 60%,transparent);display:flex;gap:10px;animation:slideup .4s var(--ez)}
.cta .b{box-shadow:0 6px 20px rgba(0,0,0,.25)}
.cta .ib{width:52px;height:52px;background:var(--el1)}
.cta .ib svg{width:20px;height:20px}

/* ---------- v1.11 : clavier intégré, techniques, notes ---------- */
.kp{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.38);display:flex;align-items:flex-end;animation:kpf .18s ease-out}
@keyframes kpf{from{opacity:0}to{opacity:1}}
.kpp{width:100%;background:var(--el1);border-radius:24px 24px 0 0;padding:10px 12px calc(12px + var(--sb));animation:sup .3s var(--ez);box-shadow:0 -10px 30px rgba(0,0,0,.25)}
.kph{display:flex;align-items:baseline;gap:8px;padding:6px 6px 12px}
.kph .l{flex:1;min-width:0;font-size:13px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpv{font-family:var(--disp);font-size:38px;font-weight:680;letter-spacing:-.02em;line-height:1;color:var(--tx)}
.kpv.fresh{color:var(--ac)}
.kph .u{font-size:14px;color:var(--tx3)}
.kpg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.kpg button{height:56px;border:0;border-radius:13px;background:var(--el2);font-size:25px;font-family:var(--num);font-weight:560;color:var(--tx);touch-action:manipulation;transition:transform .08s}
:root[data-theme="light"] .kpg button{background:var(--el3)}

function prOf(exoId,inclCur){

/* Séries d'échauffement : hors volume, records et progression.
   Règle a posteriori par exercice : seules les séries placées avant la première série de travail peuvent être des échauffements
   (charge < 80 % de la charge max du jour, reps < moitié des reps lourdes, ou dominée par une série suivante plus lourde et au moins aussi longue).
   addOnly : ne retire jamais un marquage existant. wx : choix manuel, jamais modifié. */
function warmMark(sets,addOnly){
  var by={};(sets||[]).forEach(function(x){(by[x.exoId]=by[x.exoId]||[]).push(x)});
  Object.keys(by).forEach(function(id){var e=exo(id),l=by[id];
    if(!e||e.unite!=='kg')return;
    var mx=Math.max.apply(null,l.map(function(x){return +x.charge||0}));if(!mx)return;
    var hv=l.filter(function(x){return (+x.charge||0)>=mx*.9}),rm=Math.max.apply(null,hv.map(function(x){return +x.reps||0}));
    var fw=-1;for(var i=0;i<l.length;i++){if((+l[i].charge||0)>=mx*.9&&(+l[i].reps||0)>=rm*.5){fw=i;break}}
    l.forEach(function(x,i){ if(x.wx||x.tq)return; var w=0,c=+x.charge||0,r=+x.reps||0;
      if(i<fw)w=(c<mx*.8||r<rm*.5||l.slice(i+1).some(function(y){return (+y.charge||0)>c&&(+y.reps||0)>=r}))?1:0;
      if(w)x.w=1;else if(!addOnly)delete x.w });
  });
}

function vo2Week(){var m=monday(today()),r=null;S.seances.forEach(function(s){if(s.lib&&/^vs\d/.test(s.lib)&&s.date>=m){var x=libGet(s.lib);if(x)r=x}});return r}
function vo2Next(){var vl=LIB.filter(function(x){return x.grp==='vo2'}),last=null;
  S.seances.forEach(function(s){if(s.lib&&/^vs\d/.test(s.lib)&&(!last||s.date>=last.date))last=s});
  if(!last)return vl[0];var i=vl.map(function(x){return x.id}).indexOf(last.lib);return vl[(i+1)%vl.length]}
function libGet(id){for(var i=0;i<LIB.length;i++)if(LIB[i].id===id)return LIB[i];return null}
function buildPlan(){var f=FORMATS[CFG.fmt];return f.build(CFG.par,CFG.stations,CFG.modalite)}
function planZ2(ph){return Math.round(ph.filter(function(p){return Z2KEYS[p.i]}).reduce(function(a,p){return a+p.s},0)/60)}
function planParts(ph){
  if(!ph||!ph.length)return {wu:0,cd:0,core:0};
  var wu=0,cd=0,core=0,n=ph.length;
  ph.forEach(function(p,i){ if(!Z2KEYS[p.i])return;
    if(i===0)wu+=p.s; else if(i===n-1)cd+=p.s; else core+=p.s });
  return {wu:Math.round(wu/60),cd:Math.round(cd/60),core:Math.round(core/60)};
}

/* ================= RUNNER ================= */
var T=S.timer;
function tStart(plan){ audioInit(); wakeOn(); msStart();
  T={phases:plan.phases,fmt:plan.fmt,nom:plan.nom,cat:plan.cat,modalite:plan.modalite,lib:plan.lib||null,
     idx:0,pStart:Date.now(),off:0,actual:[],running:true,pausedAt:null,laps:0,lc:-1};
  S.timer=T; save(); go('cardio');
}
function pElapsed(){ if(!T)return 0; var n=T.running?Date.now():(T.pausedAt||Date.now()); return Math.max(0,(n-T.pStart)/1000-T.off) }
function tElapsed(){ if(!T)return 0; return T.actual.reduce(function(a,b){return a+b},0)+pElapsed() }
function tPlanned(){ return T?T.phases.reduce(function(a,p){return a+p.s},0):0 }
function advance(){ if(!T)return;
  T.actual[T.idx]=pElapsed(); T.idx++; T.pStart=Date.now(); T.off=0; T.lc=-1;
  if(T.idx>=T.phases.length){ finish(); return }
  var c=T.phases[T.idx];
  if(c.k==='work'){beep(1180,.36,.32);buzz([220])} else if(c.k==='rec'){beep(600,.3,.28);buzz([90])} else {beep(880,.28,.26);buzz([120])}
  S.timer=T; save(); paint();
}
function finish(){ beep(1320,.5);setTimeout(function(){beep(880,.5)},300);buzz([300,120,300]);
  var d=Math.round(T.actual.reduce(function(a,b){return a+b},0)),m=T.modalite,n=T.nom,c=T.cat,ph=T.phases,lp=T.laps,lb=T.lib;
  var z2=planZ2(ph),pl=ph.reduce(function(a,p){return a+p.s},0),est='';
  /* blocs passés sans chrono réel (séance suivie ailleurs) : la durée prévue est reprise, à ajuster */
  if(pl&&d<pl*.4){est='chrono '+hlong(d)+' pour '+hlong(pl)+' prévus : durée prévue reprise, ajuste si besoin';d=pl}
  T=null;S.timer=null;wakeOff();msStop();CFG.fmt=null;CFG.nom=null;CFG.build=0;save();paint();
  openSheet(cardioForm({modalite:m,duree:d,note:n+(lp?' · '+lp+' tours':''),plan:ph,cat:c,z2:z2,est:est,lib:lb}));
}
function tPause(){if(!T||!T.running)return;T.pausedAt=Date.now();T.running=false;wakeOff();
  try{navigator.mediaSession.playbackState='paused'}catch(e){}S.timer=T;save();paint()}
function tResume(){if(!T||T.running)return;audioInit();T.off+=(Date.now()-T.pausedAt)/1000;T.pausedAt=null;T.running=true;wakeOn();msStart();S.timer=T;save();paint()}
function tStop(){T=null;S.timer=null;wakeOff();msStop();CFG.fmt=null;CFG.nom=null;CFG.build=0;save()}
function tick(){
  if(!T)return;
  var cur=T.phases[T.idx]; if(!cur){finish();return}
  var e=pElapsed();
  msSync(cur,cur.m==='t'?cur.s-e:e,blockTarget(T.modalite,cur.i,cur));
  if(cur.m==='t'){
    var left=cur.s-e;
    if(left<=0){advance();return}
    var sec=Math.ceil(left);
    if(sec<=3&&sec!==T.lc){T.lc=sec;beep(760,.11,.22)}
    paintRun(mmss(left),cur,e);
  }else{
    if(e>=cur.s&&T.lc!==-2){T.lc=-2;beep(760,.14,.2);buzz([60])}
    paintRun(mmss(e),cur,e);
  }
}
function paintRun(txt,cur,e){
  var c=$('#clock'); if(!c)return;
  c.textContent=txt; c.className='clock '+(cur.m==='t'?cur.k:'up');
  var nx=T.phases[T.idx+1];
  $('#next').textContent=(nx?'suivant : '+nx.l:'dernier bloc')+'   |   '+hms(tElapsed())+' / '+hms(tPlanned());
  var bars=document.querySelectorAll('#pbar i');
  for(var i=0;i<bars.length;i++){var b=bars[i].firstChild;if(!b)continue;
    b.style.transform='scaleX('+(i<T.idx?1:(i>T.idx?0:Math.min(1,e/T.phases[i].s))).toFixed(3)+')'}
}

/* ================= BLOCS MUSCU ================= */
function blocActif(){for(var i=S.blocs.length-1;i>=0;i--)if(S.blocs[i].actif)return S.blocs[i];return null}
function blocSemaine(b){if(!b)return 0;return Math.min(b.semaines,Math.floor(dayAgo(b.debut)/7)+1)}
function blocFini(b){return b&&Math.floor(dayAgo(b.debut)/7)+1>b.semaines}
/* Séries de travail au poids du jour (hors échauffements et séries de rampe très courtes) */
function workSets(l){return (l||[]).filter(function(x){return !x.w&&(+x.reps||0)>0})}
function topSets(l){var w=workSets(l);if(!w.length)return [];
  var mx=Math.max.apply(null,w.map(function(x){return +x.charge||0}));
  var t=w.filter(function(x){return (+x.charge||0)>=mx-.01});
  var rm=Math.max.apply(null,t.map(function(x){return +x.reps||0}));
  return t.filter(function(x){return (+x.reps||0)>=rm*.5})}
/* Fourchette déduite : reps minimales de la première séance à la charge actuelle (série continue, écart < 6 semaines).
   Bas de fourchette = ce que tu tenais en arrivant à ce poids ; haut = bas + 2 (bas + 4 au delà de 12 reps). */
function autoRange(exoId){
  var hist=exoHistory(exoId),cur=null,first=null,pd=null;
  for(var i=hist.length-1;i>=0;i--){var t=topSets(hist[i].sets.filter(function(x){return !x.tq}));if(!t.length)continue;
    var c=+t[0].charge||0;
    if(cur===null)cur=c;else if(Math.abs(c-cur)>.01)break;
    if(pd&&(pDate(pd)-pDate(hist[i].date))/864e5>42)break;
    first=t;pd=hist[i].date}
  if(!first)return null;
  var lo=Math.max(1,Math.min.apply(null,first.map(function(x){return +x.reps||0})));
  return {lo:lo,hi:lo+(lo>=12?4:2)};
}

  var pane=d.firstChild,y0=null,dy=0,t0=0,v=0,ly=0,lt=0,trk=0;
  pane.addEventListener('touchstart',function(e){ if(pane.scrollTop>0){y0=null;return} y0=ly=e.touches[0].clientY;t0=lt=Date.now();dy=0;v=0;trk=0 },{passive:true});
  pane.addEventListener('touchmove',function(e){ if(y0===null)return;
    var y=e.touches[0].clientY,now=Date.now();dy=y-y0;
    if(!trk){ if(dy<-4||pane.scrollTop>0){y0=null;return} if(dy<6)return; trk=1;pane.style.transition='none';d.style.transition='none' }
    if(now>lt){v=.7*v+.3*(y-ly)/(now-lt)}ly=y;lt=now;
    var t=Math.max(0,dy);pane.style.transform='translateY('+t+'px)';
    d.style.background='rgba(0,0,0,'+(.42*Math.max(0,1-t/Math.max(1,pane.offsetHeight))).toFixed(3)+')' },{passive:true});
  function rel(){ if(y0===null)return; y0=null; if(!trk)return; trk=0;
    var h=pane.offsetHeight||1,far=dy>h*.35,fl=v>.45&&dy>24;
    pane.style.transition='transform .5s var(--ez)';d.style.transition='background-color .5s var(--ez)';
    if(far||fl){ pane.style.transition='transform .28s var(--ez-out)';d.style.transition='background-color .28s var(--ez-out)';
      pane.style.transform='translateY('+h+'px)';d.style.background='rgba(0,0,0,0)';document.body.classList.remove('lock');
      setTimeout(function(){ if(d.parentNode)d.remove() },290) }
    else{ pane.style.transform='';d.style.background='' } }

        (o.sets||[]).forEach(function(x){ if(x.exoId!==st.exoId||x.w||(x.tq||'')!==(st.tq||''))return; best.n++;
          if(e.unite==='kg'){var v=e1rm(+x.charge||0,+x.reps||0); if(v>best.e1)best.e1=v}
          else if((+x.reps||0)>best.reps)best.reps=+x.reps||0 })});

function rTop(x,y,w,h,r){r=Math.min(r,w/2,h);if(h<=0)return '';
  return 'M'+x+' '+(y+h)+'V'+(y+r)+'Q'+x+' '+y+' '+(x+r)+' '+y+'H'+(x+w-r)+'Q'+(x+w)+' '+y+' '+(x+w)+' '+(y+r)+'V'+(y+h)+'Z'}
function infoHTML(t){return t?'<span class="big">'+t.big+'</span><span class="u">'+(t.u||'')+'</span><span class="sm">'+(t.sm||'')+'</span>':''}
function barChart(id,cols,o){
  o=o||{};var W=340,H=o.h||150,L=32,B=18,T=6,n=cols.length;
  var tot=cols.map(function(c){return c.segs.reduce(function(a,s){return a+s.v},0)});
  var mx=niceMax(Math.max.apply(null,tot.concat([o.goal||0,o.min||0]))*1.05);
  var cw=(W-L)/n,bw=Math.min(18,cw*.6),sy=function(v){return T+(H-T-B)*(1-v/mx)};
  var s='';
  [0,.5,1].forEach(function(f){var y=sy(mx*f).toFixed(1);
    s+='<line class="gl" x1="'+L+'" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text class="ax axr" x="'+(L-6)+'" y="'+(+y+3.5)+'">'+(o.yf?o.yf(mx*f):fmtN(mx*f))+'</text>'});
  cols.forEach(function(c,i){
    var x=L+cw*i+(cw-bw)/2,acc=0,g='',k=c.segs.filter(function(q){return q.v>0});
    k.forEach(function(q,j){
      var y0=sy(acc),y1=sy(acc+q.v),h=y0-y1-(j<k.length-1?2:0);if(h<1)h=1;
      g+=j===k.length-1?'<path d="'+rTop(x,y1,bw,h,4)+'" fill="var('+q.c+')"/>':'<rect x="'+x+'" y="'+(y1+2)+'" width="'+bw+'" height="'+(h)+'" fill="var('+q.c+')"/>';
      acc+=q.v});
    s+='<g class="bk'+(i===n-1?'':'')+'" data-i="'+i+'">'+g+'</g>';
    if(c.lab&&(o.every?i%o.every===0||i===n-1:1))s+='<text class="ax axm" x="'+(x+bw/2)+'" y="'+(H-4)+'">'+c.lab+'</text>';
    s+='<rect class="hit" data-act="tip" data-ch="'+id+'" data-i="'+i+'" x="'+(L+cw*i)+'" y="0" width="'+cw+'" height="'+H+'"/>';
  });
  if(o.goal){var gy=sy(o.goal).toFixed(1);s+='<line class="goal" x1="'+L+'" x2="'+W+'" y1="'+gy+'" y2="'+gy+'"/><text class="goalt" x="'+W+'" y="'+(gy-4)+'">objectif</text>'}
  CHD[id]=cols.map(function(c){return c.tip});
  var last=n-1;for(var i=n-1;i>=0;i--)if(tot[i]>0){last=i;break}
  return '<div class="chart" id="'+id+'"><div class="cinfo" id="'+id+'-i">'+infoHTML(cols[last]&&cols[last].tip)+'</div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||'')+'">'+s+'</svg>'+(o.legend||'')+'</div>';
}
function lineChart(id,pts,o){
  o=o||{};var W=340,H=o.h||160,L=36,B=18,T=10,R=10;
  if(!pts.length)return '';
  var ys=pts.map(function(p){return p.y}),mn=Math.min.apply(null,ys),mx=Math.max.apply(null,ys);
  var pad=(mx-mn)*.15||mx*.08||1;mn=Math.max(0,mn-pad);mx=mx+pad;
  var x0=pts[0].x,x1=pts[pts.length-1].x;if(x1===x0){x0-=864e5*7;x1+=864e5*7}
  var sx=function(x){return L+(W-L-R)*(x-x0)/(x1-x0)},sy=function(v){return T+(H-T-B)*(1-(v-mn)/(mx-mn))};
  var s='';
  [0,.5,1].forEach(function(f){var v=mn+(mx-mn)*f,y=sy(v).toFixed(1);
    s+='<line class="gl" x1="'+L+'" x2="'+W+'" y1="'+y+'" y2="'+y+'"/><text class="ax axr" x="'+(L-6)+'" y="'+(+y+3.5)+'">'+(o.yf?o.yf(v):Math.round(v))+'</text>'});
  var d=pts.map(function(p,i){return(i?'L':'M')+sx(p.x).toFixed(1)+' '+sy(p.y).toFixed(1)}).join('');
  if(pts.length>1)s+='<path class="ar" d="'+d+'L'+sx(pts[pts.length-1].x).toFixed(1)+' '+(H-B)+'L'+sx(pts[0].x).toFixed(1)+' '+(H-B)+'Z"/><path class="ln" d="'+d+'"/>';
  pts.forEach(function(p,i){var cx=sx(p.x).toFixed(1),cy=sy(p.y).toFixed(1);
    s+='<g class="bk" data-i="'+i+'"><circle class="pt'+(p.pr?' pr':'')+'" cx="'+cx+'" cy="'+cy+'" r="4"/></g>'+
       '<circle class="hit" data-act="tip" data-ch="'+id+'" data-i="'+i+'" cx="'+cx+'" cy="'+cy+'" r="14"/>'});
  var f=new Date(pts[0].x),l=new Date(pts[pts.length-1].x);
  s+='<text class="ax" x="'+L+'" y="'+(H-4)+'">'+f.getDate()+' '+MC[f.getMonth()]+'</text><text class="ax axr" x="'+(W-R)+'" y="'+(H-4)+'">'+l.getDate()+' '+MC[l.getMonth()]+'</text>';
  CHD[id]=pts.map(function(p){return p.tip});
  return '<div class="chart" id="'+id+'"><div class="cinfo" id="'+id+'-i">'+infoHTML(pts[pts.length-1].tip)+'</div>'+
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(o.aria||'')+'">'+s+'</svg></div>';
}
function chartTip(id,i){
  var c=document.getElementById(id);if(!c)return;
  var sel=c.querySelector('.bk.sel'),bk=c.querySelector('.bk[data-i="'+i+'"]');
  if(sel)sel.classList.remove('sel');
  if(sel===bk){c.classList.remove('has-sel');var t0=CHD[id];i=t0.length-1}
  else{c.classList.add('has-sel');if(bk)bk.classList.add('sel')}
  var inf=document.getElementById(id+'-i');if(inf&&CHD[id]&&CHD[id][i])inf.innerHTML=infoHTML(CHD[id][i]);hap('tap');
}
function legendHTML(keys){return '<div class="legend">'+keys.map(function(k){return '<span><i style="--c:var(--c-'+CATK[k]+')"></i>'+k+'</span>'}).join('')+'</div>'}
function minutesOf(s){return Math.round((+s.duree||0)/60)}
function weekSeries(n){
  var out=[],m0=monday(today());
  for(var i=n-1;i>=0;i--){var d=addDays(m0,-7*i);out.push(weekOf(d))}
  return out;
}
function heatmap(weeks){
  var m0=monday(today()),start=addDays(m0,-7*(weeks-1)),byDay={};
  S.seances.forEach(function(s){byDay[s.date]=(byDay[s.date]||0)+Math.max(minutesOf(s),s.type==='renfo'&&!s.duree?45:0)});
  var cells='',heads='',td=today(),lastM=-1,cnt=0;
  for(var w=0;w<weeks;w++){
    var wk=addDays(start,7*w),dm=pDate(wk).getMonth();
    heads+='<span>'+(dm!==lastM?MC[dm].replace('.',''):'')+'</span>';lastM=dm;
    for(var d=0;d<7;d++){var iso=addDays(wk,d),v=byDay[iso]||0;
      if(v)cnt++;
      var l=iso>td?'fut':v<=0?'':v<30?'l1':v<60?'l2':v<100?'l3':'l4';
      cells+='<i class="'+l+(iso===td?' td':'')+'" title="'+dMed(iso)+(v?' · '+v+' min':'')+'"></i>'}
  }
  return '<div class="heatm" style="grid-template-columns:repeat('+weeks+',1fr)">'+heads+'</div>'+
    '<div class="heat">'+cells+'</div>'+
    '<div class="heatl"><span style="margin-right:4px">'+cnt+' jours actifs</span><span class="grow"></span>moins<i style="background:var(--el3)"></i><i class="" style="background:color-mix(in srgb,var(--ac) 30%,var(--el3))"></i>'+
    '<i style="background:color-mix(in srgb,var(--ac) 55%,var(--el3))"></i><i style="background:color-mix(in srgb,var(--ac) 78%,var(--el3))"></i><i style="background:var(--ac)"></i>plus</div>';
}
function tlBar(ph,lg){
  var tot=ph.reduce(function(a,p){return a+p.s},0)||1;
  return '<div class="tl'+(lg?' lg':'')+'">'+ph.map(function(p){return '<i class="k-'+p.k+'" style="flex:'+(p.s/tot*100).toFixed(2)+'"></i>'}).join('')+'</div>';
}

function ring(pct,val,unit,col){

  return '<div class="ring"><svg width="108" height="108" viewBox="0 0 108 108">'+
    '<circle cx="54" cy="54" r="'+r+'" fill="none" stroke="var(--el3)" stroke-width="10"/>'+
    '<circle cx="54" cy="54" r="'+r+'" fill="none" stroke="'+(col||'var(--ac)')+'" stroke-width="10" stroke-linecap="round"'+
    ' stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg>'+
    '<div class="v"><b>'+val+'</b><i>'+unit+'</i></div></div>';

/* ================= MODULE TOM HOLLAND =================
   Cindy : AMRAP (5 tractions, 10 pompes, 15 squats), référence publique de Tom Holland 27 tours en 20 min.
   Échelle 1500 : échelons 1 à sommet puis retour à 1 ; à l'échelon k : k tractions, 2k dips, 3k pompes, 4k sit-ups, 5k squats.
   Compteur : un tap par mouvement terminé, temps enregistré à chaque tap. */
var TH={
  cindy:{nom:'Cindy',sous:'AMRAP : 5 tractions, 10 pompes, 15 squats en boucle',vers:[['rx','RX'],['band','Élastique'],['row','Rowing']],
    moves:function(v){return [{n:v==='row'?'rowing haltère':(v==='band'?'tractions élastique':'tractions'),r:5,ic:v==='row'?'row':'pullup'},{n:'pompes',r:10,ic:'pushup'},{n:'squats',r:15,ic:'airsquat'}]}},
  ladder:{nom:'Échelle 1500',sous:'Échelons 1 à 10 puis retour à 1 : tractions, dips, pompes, sit-ups, squats',vers:[['rx','RX'],['band','Élastique']],
    moves:function(v){return [{n:v==='band'?'tractions élastique':'tractions',m:1,ic:'pullup'},{n:'dips',m:2,ic:'dips'},{n:'pompes',m:3,ic:'pushup'},{n:'sit-ups',m:4,ic:'situp'},{n:'squats',m:5,ic:'airsquat'}]}}
};
TH.home={nom:'Routine maison',sous:'Barre de traction seule : tractions, relevés de jambes, pompes, repos, puis squats pour finir',
  vers:[['rx','RX'],['band','Élastique'],['knee','Genoux pliés']],
  moves:function(v,p){p=p||thP();return [{n:v==='band'?'tractions élastique':'tractions',r:p.hpu,ic:'pullup'},{n:v==='knee'?'relevés de genoux':'relevés de jambes',r:p.hlr,ic:'legraise'},{n:'pompes',r:p.hpp,ic:'pushup'}]}};
TH.wake={nom:'Routine réveil',sous:'Kettlebell swings et pompes en séries courtes avec repos minuté, pour se réveiller sans se mettre dans le rouge',
  vers:[['rx','RX'],['incl','Pompes inclinées']],
  moves:function(v,p){p=p||thP();return [{n:'KB swings',r:p.wsw,ic:'kbswing'},{n:v==='incl'?'pompes inclinées':'pompes',r:p.wpp,ic:'pushup'}]}};
/* formats en séquence figée (séries + repos) : routine maison et routine réveil */
function isSq(k){return k==='home'||k==='wake'}
function sqCfg(k,p){return k==='wake'?[p.wset,p.wsw,p.wpp,p.wkg].join('-'):homeCfg(p)}
function sqTot(k,cfg){if(k!=='wake')return homeTot(cfg);var a=String(cfg).split('-').map(Number);return a[0]*(a[1]+a[2])}
function sqVer(k){return k==='wake'?thP().wver:thP().hver}
function wakeSeq(p,v){var mv=TH.wake.moves(v,p),q=[];
  for(var x=1;x<=p.wset;x++){mv.forEach(function(m,j){q.push({n:m.n,reps:m.r,ic:m.ic,j:j,rd:x-1,set:x,end:j===mv.length-1})});
    if(x<p.wset&&p.wrest>0)q.push({rest:Math.round(p.wrest),n:'repos',reps:0,ic:'stopwatch',j:mv.length,rd:x-1,set:x})}
  return q}
function homeCfg(p){return [p.hset,p.hpu,p.hlr,p.hpp,p.hsq].join('-')}
function homeTot(cfg){var a=String(cfg).split('-').map(Number);return a[0]*(a[1]+a[2]+a[3])+a[4]}
/* séquence : séries de 3 mouvements séparées par un repos minuté, puis squats découpés par 25 pour compter sans se perdre */
function homeSeq(p,v){var mv=TH.home.moves(v,p),q=[];
  for(var x=1;x<=p.hset;x++){mv.forEach(function(m,j){q.push({n:m.n,reps:m.r,ic:m.ic,j:j,rd:x-1,set:x,end:j===mv.length-1})});
    if(x<p.hset&&p.hrest>0)q.push({rest:Math.round(p.hrest*60),n:'repos',reps:0,ic:'stopwatch',j:3,rd:x-1,set:x})}
  if(p.hsq>0){var ch=p.hsq>=40?25:p.hsq,left=p.hsq,c=0,nb=Math.ceil(p.hsq/ch),jj=0;
    while(left>0){var r=Math.min(ch,left);c+=r;left-=r;q.push({n:'squats',reps:r,ic:'airsquat',j:jj++,nb:nb,rd:p.hset,set:0,fin:1,sq:c+' / '+p.hsq,end:left===0})}}
  return q}
function parOf(k,w){return k==='cindy'?w.min:isSq(k)?w.cfg:w.top}
function thPar(k){var p=thP();return k==='cindy'?p.cmin:isSq(k)?sqCfg(k,p):p.ltop}
function thVer(k){var p=thP();return k==='cindy'?p.cver:isSq(k)?sqVer(k):p.lver}
var THK='wake',THFROM='cardio',HOLLAND=27,_wt=0;
function thP(){return S.prefs.th}
function verLbl(k,v){var a=TH[k].vers.filter(function(x){return x[0]===v})[0];return a?a[1]:v}
function wStep(w,i){
  if(isSq(w.k))return (w.seq||[])[i]||null;
  if(w.k==='cindy'){var mv=TH.cindy.moves(w.ver),j=i%3;return {rd:Math.floor(i/3),j:j,reps:mv[j].r,n:mv[j].n,ic:mv[j].ic,per:3}}
  var ml=TH.ladder.moves(w.ver),R=2*w.top-1,rd=Math.floor(i/5),jj=i%5;if(rd>=R)return null;
  var k=rd<w.top?rd+1:2*w.top-1-rd;return {rd:rd,j:jj,k:k,reps:k*ml[jj].m,n:ml[jj].n,ic:ml[jj].ic,per:5};
}
function wSteps(w){return w.k==='cindy'?Infinity:isSq(w.k)?(w.seq||[]).length:5*(2*w.top-1)}
function wReps(w,n){var t=0;for(var i=0;i<n;i++){var x=wStep(w,i);if(x&&!x.rest)t+=(w.rp&&w.rp[i]!==undefined)?w.rp[i]:x.reps}return t}
function wLess(w){return !!w.rp&&Object.keys(w.rp).some(function(i){var x=wStep(w,+i);return x&&w.rp[i]<x.reps})}
function wEl(w){if(!w||w.st==='cd')return 0;var n=w.pz||(w.st==='end'?w.endAt:Date.now());return Math.max(0,(n-w.t0-w.off)/1000)}
function wCum(w){if(isSq(w.k)){var o=[];w.taps.forEach(function(t,i){var x=wStep(w,i);if(x&&x.end)o.push(Math.round(t))});return o}
  var out=[],per=w.k==='cindy'?3:5;for(var i=per-1;i<w.taps.length;i+=per)out.push(Math.round(w.taps[i]));return out}
function wodVal(s){var w=s.wod;if(isSq(w.k))return w.full?1e6-(+s.duree||0):w.reps;return w.k==='cindy'?w.reps:(w.done?1e6-(+s.duree||0):w.reps)}
function wodBest(k,ver,par,excl){var b=null;S.seances.forEach(function(s){var w=s.wod;if(!w||w.k!==k||w.ver!==ver||s.id===excl)return;
  if(parOf(k,w)!==par)return;var v=wodVal(s);if(!b||v>b.v)b={v:v,s:s}});return b}
function wodTxt(s){var w=s.wod;if(isSq(w.k))return w.full?hms(s.duree):fmtN(w.reps)+' / '+fmtN(sqTot(w.k,w.cfg));
  if(w.k==='cindy')return w.rounds+' tour'+(w.rounds>1?'s':'')+(w.part?' + '+w.part:'');
  return w.done?hms(s.duree):fmtN(w.reps)+' / '+fmtN(15*w.top*w.top)}
function wodGoal(){var p=thP();if(p.cgoal>0)return p.cgoal;var b=wodBest('cindy',p.cver,p.cmin);return b?Math.floor(b.s.wod.reps/30)+1:0}
function cindyProg(w){var n=w.taps.length;return Math.floor(n/3)+[0,5,15][n%3]/30}
function setTxt(sel,t){var e=$(sel);if(e&&e.textContent!==t)e.textContent=t}
function wodStart(k){var p=thP();if(T)return;audioInit();wakeOn();restStop();
  S.wod={k:k,ver:thVer(k),min:p.cmin,top:p.ltop,goal:k==='cindy'?wodGoal():0,st:'cd',cdEnd:Date.now()+10000,t0:0,off:0,pz:0,taps:[],lc:-1,m1:0,endAt:0};
  if(isSq(k)){S.wod.cfg=sqCfg(k,p);S.wod.seq=k==='wake'?wakeSeq(p,p.wver):homeSeq(p,p.hver);S.wod.rp={}}
  save();window.scrollTo(0,0);paint()}
function wodTick(){var w=S.wod;if(!w||w.st==='end')return;var now=Date.now();
  if(w.st==='cd'){var l=(w.cdEnd-now)/1000;
    if(l<=0){w.st='run';w.t0=w.cdEnd;w.lc=-1;beep(1320,.4,.3);buzz([200]);save();paint();return}
    var sc=Math.ceil(l);if(sc<=3&&sc!==w.lc){w.lc=sc;beep(760,.12,.24);buzz([40])}setTxt('#wcd',String(sc));return}
  if(w.pz)return;
  var e=wEl(w);
  if(w.k==='cindy'){var left=w.min*60-e;if(left<=0){wodEnd(1);return}
    var s2=Math.ceil(left);
    if(s2<=60&&!w.m1&&w.min>1){w.m1=1;beep(980,.22,.26);buzz([90,60,90])}
    if(s2<=3&&s2!==w.lc){w.lc=s2;beep(760,.12,.24)}
    setTxt('#wclock',mmss(left));
    var pr=cindyProg(w);
    setTxt('#wpace',pr>=.5?mmss(e/pr):'—');
    setTxt('#wproj',e>=30&&pr>0?nfmt(Math.floor(pr/e*w.min*600)/10):'—');
    var el=$('#wdelta');if(el&&w.goal){var d=pr*(w.min*60/w.goal)-e;el.textContent=(d>=0?'+':'−')+mmss(Math.abs(d));el.className=d>=0?'ahead':'behind'}
  }else{setTxt('#wclock',hms(e));var rp=wReps(w,w.taps.length);setTxt('#wpace',e>=20&&rp?String(Math.round(rp/e*60)):'—');
    if(isSq(w.k)){var x=wStep(w,w.taps.length);if(x&&x.rest){var lt=w.taps.length?w.taps[w.taps.length-1]:0,rem=x.rest-(e-lt);
      if(rem<=0){w.taps.push(Math.round((lt+x.rest)*10)/10);w.lc=-1;beep(1320,.4,.3);buzz([200,80,200]);save();paint();return}
      var s3=Math.ceil(rem);if(s3<=3&&s3!==w.lc){w.lc=s3;beep(760,.12,.24)}setTxt('#wrest',mmss(rem))}}}
}
function wodTap(rp){var w=S.wod;if(!w||w.st!=='run'||w.pz)return;var now=Date.now();if(rp===undefined&&now-_wt<350)return;_wt=now;
  var x=wStep(w,w.taps.length);if(!x)return;
  if(rp!==undefined&&!x.rest){w.rp=w.rp||{};w.rp[w.taps.length]=Math.max(0,rp)}
  w.taps.push(Math.round(wEl(w)*10)/10);
  if(isSq(w.k)?x.end:w.taps.length%x.per===0){beep(1320,.12,.3);setTimeout(function(){beep(1760,.16,.3)},120);hap('big')}else{beep(1040,.07,.22);hap('ok')}
  save();
  if((w.k==='ladder'||isSq(w.k))&&w.taps.length>=wSteps(w)){wodEnd(1);return}
  paint()}
function wodEnd(auto){var w=S.wod;if(!w)return;var now=Date.now();
  if(w.st==='cd'){S.wod=null;wakeOff();save();paint();return}
  if(w.pz){w.off+=now-w.pz;w.pz=0}
  w.endAt=(w.k==='cindy'&&auto)?w.t0+w.off+w.min*60000:now;
  w.st='end';wakeOff();

  var t=h.querySelector('.exo>header .n,.n,.t');var base=t?(t.firstChild&&t.firstChild.nodeType===3?t.firstChild.textContent:t.textContent):'';
  var u=inp.parentNode.querySelector('.u');return base+(u&&h.classList.contains('exo')?' · '+u.textContent:'')}
function openKp(inp){closeKp(1);if(!inp)return;
  var dec=!!inp.dataset.kd||/^c_|^c_|cp_/.test(inp.id)||/^c_/.test(inp.id);
  var u=inp.parentNode.querySelector('.u'),unit=u?u.textContent:'',step=null;
  var sb=inp.closest('.stp');if(sb){var bp=sb.querySelector('[data-act="stp"][data-v]:last-child');if(bp)step=+bp.dataset.v}
  KP={inp:inp,v:String(inp.value===''?'':inp.value).replace('.',','),fresh:true,dec:dec||(step&&step%1!==0)};
  var d=document.createElement('div');d.className='kp';d.id='kp';
  var keys=['1','2','3','4','5','6','7','8','9',KP.dec?',':'','0','⌫'];
  d.innerHTML='<div class="kpp" role="dialog" aria-label="Saisie numérique"><div class="kph"><span class="l">'+esc(kpLabel(inp))+'</span><span class="kpv fresh" id="kpv"></span><span class="u">'+esc(unit)+'</span></div>'+
    (step?'<div class="kpc">'+[-2*step,-step,step,2*step].map(function(q){return '<button data-act="kp-q" data-v="'+q+'">'+(q>0?'+':'−')+nfmt(Math.abs(q))+'</button>'}).join('')+'</div>':'')+
    '<div class="kpg">'+keys.map(function(k){return '<button data-act="kp-k" data-k="'+k+'"'+(k?' aria-label="'+(k==='⌫'?'Effacer':k)+'"':' disabled style="visibility:hidden"')+'>'+k+'</button>'}).join('')+'</div>'+
    '<div class="btns"><button class="b" data-act="kp-x">Annuler</button><button class="b pri" data-act="kp-ok">OK</button></div></div>';
  d.addEventListener('click',function(e){if(e.target===d)closeKp()});
  document.body.appendChild(d);kpPaint();hap('sel')}
function kpPaint(){var e=$('#kpv');if(!e||!KP)return;e.textContent=KP.v===''?'0':KP.v;e.classList.toggle('fresh',KP.fresh)}
function kpKey(k){if(!KP)return;
  if(KP.fresh&&k!=='⌫'){KP.v='';KP.fresh=false}
  if(k==='⌫'){KP.fresh=false;KP.v=KP.v.slice(0,-1)}
  else if(k===','){if(KP.v.indexOf(',')<0)KP.v=(KP.v||'0')+','}
  else if(KP.v.replace(',','').length<6){KP.v=(KP.v==='0'?'':KP.v)+k}
  hap('tap');kpPaint()}
function kpQuick(q){if(!KP)return;var v=parseFloat(KP.v.replace(',','.'))||0;v=Math.max(0,Math.round((v+q)*100)/100);KP.v=String(v).replace('.',',');KP.fresh=false;hap('tap');kpPaint()}
function kpOk(){if(!KP)return;var inp=KP.inp,t=KP.v.replace(',','.');
  if(t!==''&&t!=='.'){var v=parseFloat(t);if(!isNaN(v)){inp.value=v;inp.dispatchEvent(new Event('input',{bubbles:true}));inp.dispatchEvent(new Event('change',{bubbles:true}))}}
  hap('ok');closeKp()}
function closeKp(now){var d=$('#kp');KP=null;if(d)d.remove()}
setInterval(function(){var e=$('#sdur');if(e&&S.cur)e.textContent=hms((Date.now()-S.cur.startedAt)/1000)},1000);

if('serviceWorker' in navigator){
  var _rl=false;
  navigator.serviceWorker.addEventListener('controllerchange',function(){ if(_rl)return;_rl=true;location.reload() });
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(function(r){ setInterval(function(){r.update().catch(function(){})},60*60*1000) }).catch(function(){});
  });
}
if(T)TAB='cardio';
if(S.wod&&S.wod.st!=='end')wakeOn();
if(!TAB)TAB='bilan';
try{var _st=JSON.parse(localStorage.getItem(KEY));if(!_st||_st.schema!==SCHEMA)save()}catch(e){save()}
paint();
onbCheck(); if(ONB)showOnb(ONB);
if(/^#p=/.test(location.hash)){var _hc=location.hash;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}hImportCode(_hc)}
</script>
